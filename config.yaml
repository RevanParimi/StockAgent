# =============================================================================
# StockAgent tunable configuration
# Precedence: environment variable  >  this file  >  hardcoded fallback (base.py)
# Secrets (API keys, webhook URLs) NEVER go here — they stay in .env.
# =============================================================================

llm:
  # Hybrid model tiers — 2026-06-03 benchmark (scripts/model_bench.py), bulk tier
  # re-benchmarked 2026-07-02, reasoning tier re-benchmarked 2026-07-03
  # (scripts/reasoning_bench.py + live unified-analyst runs on MARUTI).
  #   fast      – chat tool-loop (tools + free text, no json_object): qwen/qwen3.6-flash
  #   reasoning – judgment calls (aggregator verdict, RL feedback/thesis, unified
  #               analyst): z-ai/glm-5.2 — $0.686/$2.156 per M vs $1.25/$3.75 for
  #               qwen3.7-max (~45% cheaper), AA intelligence 51 vs max's 46
  #               (reasoning-on numbers; our reasoning-off bench: 100% JSON, all
  #               production checks). Live MARUTI analyst agreed with max's verdict.
  #               Fallbacks on file: qwen/qwen3.7-plus ($0.32/$1.28, max savings,
  #               AA 39) and deepseek/deepseek-v4-pro ($0.435/$0.87, 1.8x slower,
  #               vendor-concentrates with bulk).
  #   bulk      – high-volume sector-agent scoring (json_object): deepseek/deepseek-v4-flash
  #               $0.09/$0.18 per M (vs 0.36/0.40 for retired qwen-2.5-72b), 1M ctx,
  #               json_object verified 2026-07-02 with reasoning disabled.
  # NB 2026-07: OpenRouter silently rolled several models to thinking-by-default
  # snapshots, truncating json_object output. EVERY json_object call site passes
  # extra_body=JSON_MODE_EXTRA_BODY (llm_client.py) to disable reasoning.
  # Retired: qwen3-235b (broke JSON), qwen-2.5-72b (2-4x cost of deepseek),
  # Gemini 3.5 Flash (broken output + 64x cost), Kimi (empty + 68s).
  # Rejected 2026-07-03: minimax-m3 (non-JSON 3/12), minimax-m2.7 (OpenRouter 400:
  # reasoning cannot be disabled — violates the JSON_MODE_EXTRA_BODY rule).
  model_fast: "qwen/qwen3.6-flash"
  model_reasoning: "z-ai/glm-5.2"
  model_bulk: "deepseek/deepseek-v4-flash"
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 120   # was 60; prod ran 120 via env var (long analyst calls) — unified 2026-07-06
  # Token cost rates (USD per million) for telemetry — default to the BULK tier.
  # These flat rates are the UNKNOWN-MODEL fallback only; known models use cost_rates.
  input_cost_per_m: 0.09
  output_cost_per_m: 0.18
  # Per-model cost rates (USD per million tokens) — AUD-105. Keyed on the exact
  # OpenRouter model id each call site logs; models not listed fall back to the
  # flat input/output_cost_per_m above. Live OpenRouter prices 2026-07-17
  # (NB glm-5.2 was repriced upstream from 0.686/2.156 at the 2026-07-03 bench).
  cost_rates:
    "z-ai/glm-5.2": [1.218, 3.828]
    "deepseek/deepseek-v4-flash": [0.098, 0.196]
    "qwen/qwen3.6-flash": [0.1875, 1.125]

logging:
  # Permanent log/telemetry archive (services/data/stores/log_store.py).
  # Lives under data/ so it sits on the Railway volume and SURVIVES DEPLOYS.
  telemetry_db_path: "data/telemetry.db"

agent_execution:
  timeout_seconds: 180   # was 120; prod ran 180 via env var — unified 2026-07-06
  max_retries: 3
  retry_delay_seconds: 2.0

# Signal Aggregator – agent weights (must sum to 1.0)
agent_weights:
  sales_demand: 0.15
  raw_materials: 0.09
  fundamentals: 0.18
  pattern_analysis: 0.11
  sentiment: 0.04
  policy_regulatory: 0.09
  competitive_intel: 0.09
  risk_macro: 0.13
  valuation_catalyst: 0.12

# Score thresholds for the final stock score (rendered as tuples in base.py)
score_thresholds:
  strong_buy: [0.75, 1.00]
  buy: [0.55, 0.75]
  neutral: [0.40, 0.55]
  sell: [0.20, 0.40]
  strong_sell: [0.00, 0.20]

data_fetch:
  news_articles_per_query: 5
  serper_max_queries: 3          # per agent run — controls API cost
  # RL daily review only: one extra /search call when /news returns no in-window
  # article for a ticker (F1 sensing fix). Set false to hard-cap at 1 call/ticker.
  news_context_fallback_search: true
  # Recency bound sent to Google for that query. Unbounded, the top /news hits
  # are months-old earnings roundups and the 3-day filter drops all of them —
  # that was the real cause of the 12/16 news-blind reviews. "" disables.
  news_context_recency: "qdr:w"    # keep >= the review's 3-day window
  # Same bound for the shared fetch_news_context() path (analyst bundle, RL
  # research loop, indicator price fallback). Unbounded it served articles
  # 2 months to 11 years old, mostly undated. "" disables.
  news_search_recency: "qdr:m"
  preopen_news_recency: "qdr:w"    # shock rater scores OVERNIGHT news — tighter
  financials_lookback_quarters: 4
  serper_timeout_seconds: 10
  tavily_max_content_chars: 600
  price_history_years: 10        # OHLCV history for pattern analysis
  technical_refresh_interval_min: 15
  # Macro cache: HIT saves Serper calls for every stock in the same sector
  # within the TTL (keys: automobile / bfsi / it).
  macro_cache_ttl_hours: 4.0

scheduler:
  enabled: false                 # master switch (true in Railway prod via env)
  cron: "30 8 * * 1-5"           # weekdays 8:30am IST
  tickers: ["MARUTI", "TATAMOTORS", "M&M", "HEROMOTOCO", "BAJAJ-AUTO"]
  # Fields go RAW into CronTrigger(timezone="Asia/Kolkata") — IST times, NAMED
  # days only (numeric days are 0=Mon in APScheduler: "1-5" meant Tue–Sat, AUD-038).
  feedback_cron: "30 16 * * mon-fri"  # daily RL review: Mon–Fri 16:30 IST
  alert_score_change_threshold: 0.10
  alert_on_verdict_change: true
  alert_channels: ["console", "file"]
  score_history_max_rows: 90     # ~3 months daily

chat:
  max_review_cycles: 0           # reviewer loop removed in 3-node pipeline redesign

analyse:
  daily_quota: 10                # per-member on-demand pipeline runs per IST day
                                 # (POST /analyse + WS /ws/stream). Owner exempt;
                                 # 0 = unlimited. One run ≈ 8 LLM calls.

watchdog:
  enabled: true                  # master gate for the ops_watchdog job
  prep_enabled: true             # auto-run safe, idempotent prep (e.g. Atlas ETL)
  hour: 6                        # IST. Deliberately NOT the 23:xx cluster:
  minute: 30                     #   "your window is open today" at 23:45 is useless

macro_news:
  enabled: true
  retain_days: 90
  context_max_items: 3           # HIGH-severity items per synthesize call
  reviewer_max_items: 5

regime:
  # Regime detection thresholds
  vix_volatile_threshold: 22.0
  vix_low_vol_threshold: 14.0
  fii_proxy_threshold_pct: 1.0   # Nifty 5-day move threshold for FII proxy
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  # Sticky-regime hysteresis: consecutive milder detections required to exit
  calm_days: 3

# Applied on top of learned WeightMemory weights (daily-only modifier, not stored).
# Agents not listed default to 1.0.
regime_multipliers:
  MACRO_CRISIS:
    risk_macro: 1.40
    fundamentals: 0.80
    sales_demand: 0.70
    sentiment: 0.80
    pattern_analysis: 0.90
    competitive_intel: 1.00
    valuation_catalyst: 0.90
    raw_materials: 1.00
    policy_regulatory: 1.00
  RISK_OFF:
    risk_macro: 1.20
    fundamentals: 0.90
    sales_demand: 0.85
    sentiment: 0.90
    pattern_analysis: 0.95
    competitive_intel: 1.00
    valuation_catalyst: 0.95
    raw_materials: 1.00
    policy_regulatory: 1.00
  NORMAL:
    risk_macro: 1.00
    fundamentals: 1.00
    sales_demand: 1.00
    sentiment: 1.00
    pattern_analysis: 1.00
    competitive_intel: 1.00
    valuation_catalyst: 1.00
    raw_materials: 1.00
    policy_regulatory: 1.00
  RISK_ON:
    risk_macro: 0.90
    fundamentals: 1.10
    sales_demand: 1.10
    sentiment: 1.15
    pattern_analysis: 0.95
    competitive_intel: 1.00
    valuation_catalyst: 1.10
    raw_materials: 1.00
    policy_regulatory: 1.00
  MOMENTUM_EXTENDED:
    risk_macro: 0.85
    fundamentals: 1.05
    sales_demand: 0.95
    sentiment: 0.80
    pattern_analysis: 1.20
    competitive_intel: 1.00
    valuation_catalyst: 1.10
    raw_materials: 1.00
    policy_regulatory: 1.00
  OVERSOLD:
    risk_macro: 1.10
    fundamentals: 1.00
    sales_demand: 1.00
    sentiment: 0.90
    pattern_analysis: 1.30
    competitive_intel: 1.00
    valuation_catalyst: 1.05
    raw_materials: 1.00
    policy_regulatory: 1.00

# REGIME_MULTIPLIERS uses automobile agent names as canonical keys; map each
# sector's agents to the closest automobile role. Unlisted agent -> 1.0.
sector_agent_regime_role:
  banking_bfsi:
    fundamentals: fundamentals        # earnings quality
    risk: risk_macro                  # credit risk, NPA
    macro_policy: policy_regulatory   # RBI policy
    institutional: sentiment          # FII/DII flows
    technical: pattern_analysis
    business: valuation_catalyst      # loan book growth
  it_sector:
    fundamentals: fundamentals
    risk_macro: risk_macro
    global_macro: risk_macro          # US tech spend risk
    peer_benchmark: competitive_intel # TCS vs Infosys
    transcript_nlp: sentiment         # earnings call NLP
    technical: pattern_analysis
    valuation: valuation_catalyst
  renewable_energy:
    fundamentals: fundamentals
    business: sales_demand            # capacity pipeline
    valuation: valuation_catalyst
    sentiment_policy: policy_regulatory  # MNRE/CERC policy
    technical: pattern_analysis
    risk: risk_macro                  # DISCOM/curtailment risk
  automobile:                          # identity mapping
    sales_demand: sales_demand
    raw_materials: raw_materials
    fundamentals: fundamentals
    pattern_analysis: pattern_analysis
    sentiment: sentiment
    policy_regulatory: policy_regulatory
    competitive_intel: competitive_intel
    risk_macro: risk_macro
    valuation_catalyst: valuation_catalyst
  generic:                           # Compass Phase B — generic sector graph
    business: sales_demand
    fundamentals: fundamentals
    valuation: valuation_catalyst
    technical: pattern_analysis
    macro: risk_macro
    risk: risk_macro
    management: competitive_intel
    earnings: fundamentals

rl:
  # -- Forecast + weight adaptation (Phase 5) ------------------------------
  forecast_horizon_days: 30
  weight_max_step: 0.05            # max weight change per daily step
  weight_max_drift: 0.15           # max total drift from base value
  weight_min_observations: 3
  weight_accuracy_window: 7
  weight_boost_hit_rate: 0.70      # >=70% hit rate -> boost
  weight_penalty_hit_rate: 0.40    # <=40% hit rate -> penalty
  # -- Direction / early-exit ----------------------------------------------
  flat_threshold_pct: 0.3          # moves within +/-0.3% classified FLAT
  agent_rerun_threshold_pct: 0.5   # skip re-run when direction OK + error below; 0 disables
  scheduler_max_workers: 1         # 1 = sequential (safe without file locking)
  # -- Conviction streak (P3) ----------------------------------------------
  streak_warning_threshold: 8
  rsi_amplifier: 1.50
  max_reversion_prior: 0.30
  # -- ThesisReviewer ------------------------------------------------------
  atr_threshold_floor: 1.5
  atr_threshold_multiplier: 1.5
  # -- Lesson propagation (P2) ---------------------------------------------
  lesson_blend_existing: 0.70
  lesson_blend_incoming: 0.30
  cross_ticker_boost: 0.05
  # -- Weight delta constants (STATIC_AUDIT #4) ----------------------------
  boost: 0.02
  penalty: -0.03
  miss_streak_penalty: -0.05
  bias_trigger: 0.55
  bias_full: 0.70
  timing_free_window: 3
  timing_partial_window: 7
  weight_drift_escape_days: 14     # streak length unlocking drift escape
  weight_drift_escape_multiplier: 1.5
  # -- Calibration reward (Intelligence Phase C2) --------------------------
  calibration_reward_enabled: true
  calibration_weight: 0.5
  # -- Hard-bind verdict (AUD-117 / AUD-077) -------------------------------
  hard_bind_verdict_enabled: true    # bind graded+aggregator verdict to learned composite
  # -- Market-wide fallback context (F2 sensing fix) ------------------------
  # When a ticker has NO company news, inject HIGH/MEDIUM items from the macro
  # news cache (already fetched 4x daily — zero new API calls) so the
  # FeedbackAgent has something real to attribute a large move to instead of
  # defaulting to model_bias. false = pre-F2 behaviour (blind stays blind).
  macro_fallback_context_enabled: true
  macro_fallback_max_items: 5
  # -- Provenance on learned artifacts (F3 sensing fix) ---------------------
  # Lessons and dossier observations keep the dated headlines they were learned
  # from, so an audit can tell evidence-grounded learning from a claim written
  # on a newsless day. Retention only — no URL re-fetch or verification.
  # false = pre-F3 behaviour (provenance fields stay empty).
  provenance_enabled: true
  lesson_evidence_max_items: 3       # per lesson; oldest evicted on reinforcement
  lesson_evidence_max_chars: 160     # per evidence line
  # -- Forgetting & recency (Intelligence Phase C3) -------------------------
  forgetting_enabled: true
  miss_recency_halflife_days: 21.0
  miss_penalizable_discount: 0.3
  archive_conf_floor: 0.12
  archive_effectiveness_floor: 0.25
  archive_stale_days: 60
  feedback_halflife_months: 3.0
  # -- Ticker dossier + executable claims (Knowledge Layer) ----------------
  dossier_enabled: true
  dossier_max_observations: 30
  dossier_digest_max_chars: 2500
  dossier_agent_digest_chars: 1500
  dossier_max_new_obs_per_day: 3
  dossier_distill_input_max_chars: 20000
  claims_enabled: true
  lesson_emphasis_delta: 0.03
  lesson_emphasis_cap: 0.06
  lesson_match_min_conf: 0.45
  # -- Event-driven dossier ingestion (Phase 3) ----------------------------
  event_ingest_enabled: true
  event_ingest_lookback_days: 8
  event_ingest_max_events_per_scan: 3
  event_ingest_text_max_chars: 6000
  # -- Research loop (Phase 4) ---------------------------------------------
  research_loop_enabled: true
  research_max_questions_per_run: 2
  research_max_attempts: 3
  research_context_max_chars: 6000
  # -- Control lane + monthly scorecard (Phase 1) ---------------------------
  control_lane_enabled: true
  control_lane_model: ""           # empty -> llm.model_reasoning
  scorecard_enabled: true
  # -- Living Envelope (Phase 2.5) ------------------------------------------
  reforecast_enabled: true
  reforecast_max_per_month: 2
  reforecast_thesis_mult_threshold: 0.5
  regime_sticky_enabled: true
  preopen_check_enabled: true
  preopen_shock_severity: 0.7
  # -- NSE official close cross-check ---------------------------------------
  close_verify_enabled: true
  close_verify_tolerance_pct: 1.0

unified_analyst:
  # CSV of sectors on the unified one-call path; "" disables everywhere.
  sectors: "automobile,banking_bfsi,it_sector,renewable_energy,generic"
  fallback_legacy: true
  max_tokens: 6000
  section_max_chars: 2500
  bundle_max_chars: 18000

# =============================================================================
# Compass Phase A — Portfolio Core + Position Advisor (spec 2026-07-06)
# =============================================================================
portfolio:
  data_dir: "data/portfolio"     # per-user roots: data/portfolio/<user_id>/
  default_user_id: "primary"     # single-user launch; per-user layout from day one
  max_managed_tickers: 40        # auto-promotion cap — guards LLM spend (~$19/mo at 40)
  weekly_review_weekday: 4       # Friday: watchlist-cadence names review this weekday only

advisor:
  enabled: true
  narrate: true                  # BULK-tier narration of verdicts (deterministic fallback on failure)
  # Volatility-scaled stops, not a flat % (spec §5.2):
  # stop_pct = clamp(stop_atr_mult × ATR(atr_period) as %, bucket floor, bucket cap)
  atr_period: 20
  stop_atr_mult: 3.0
  stop_buckets:                  # [floor_pct, cap_pct] per market-cap bucket
    large: [8.0, 12.0]
    mid:   [12.0, 18.0]
    small: [15.0, 22.0]
  large_cap_floor_cr: 65000      # ₹ crore free-float mcap thresholds for bucket resolution
  mid_cap_floor_cr: 20000
  trim_profit_pct: 25.0
  reversion_prior_elevated: 0.20 # conviction-streak reversion prior considered "elevated"
  confidence_decline_threshold: 0.05  # remaining-envelope confidence drop that counts as declining
  envelope_flat_band_pct: 1.0    # remaining-forecast drift within ±this% = FLAT
  add_min_direction_accuracy: 0.60    # last-7-entries hit rate needed for ADD
  max_position_pct: 10.0
  sector_concentration_warn_pct: 30.0
  ltcg_wait_min_months: 10       # TRIM in month 10-12 with intact thesis -> WAIT_FOR_LTCG note
  earnings_gap_days: 3           # profitable + earnings within N trading days -> protection flag
  switch_conviction_gap: 0.15    # SWITCH: shelf idea must beat holding envelope confidence by this (spec §5.2)

# =============================================================================
# Compass Phase B — Discovery funnel + generic sector graph (spec 2026-07-06 §6/§8)
# =============================================================================
discovery:
  enabled: true
  history_days: 550              # rolling EOD window (~2.2yr; 12m momentum needs 252 tds)
  bhavcopy_dir: "data/market_cache/bhavcopy"
  data_dir: "data/discovery"     # screens/, shelf.json, shelf_events.jsonl
  paper_data_dir: "data/rl/paper/predictions"   # ISOLATED paper-lane store root (spec §6.3)
  liquidity_floor_cr: 5.0        # median daily traded value ≥ ₹5 cr
  float_mcap_floor_cr: 500.0     # free-float mcap ≥ ₹500 cr (thin float = operator bait)
  min_price: 20.0                # no penny stocks
  max_promoter_pledge_pct: 25.0  # guard ships dark in v1 (no free data source yet)
  circuit_streak_max: 3          # > N trailing upper-circuit days = operator pattern
  shortlist_size: 80             # bhavcopy-ranked names that get per-symbol guard checks
  max_candidates: 40             # ScreenResult size after guards
  deep_dive_count: 10            # weekly unified-analyst calls (LLM cost cap)
  shelf_size: 10                 # max active shelf ideas
  stale_days: 60                 # idea age without trigger -> rotate out
  min_conviction: 0.55           # deep-dive final_score floor to reach the shelf (= BUY threshold)
  include_sme: false             # SME platform excluded by default (spec §6.2)
  signal_weights:                # composite rank blend; renormalized over LIVE signals
    momentum: 0.30               # 6m+12m vol-adjusted (NSE Momentum-50 style)
    delivery_surge: 0.15         # 5d delivery% vs prior 20d
    volume_breakout: 0.15        # 5d/60d volume ratio, gated on 60d-high proximity
    bulk_block: 0.15             # same-side bulk/block net accumulation over 4wks
    high_52wk_rs: 0.10           # 52wk-high proximity + 3m relative strength
    insider_buying: 0.10         # DARK in v1 — fetcher returns None until a source ships
    mf_holding: 0.05             # DARK in v1 — AMC portfolio parsing is its own sub-project

  # -- Stage-2 IPO / new-listing tracker (Compass Phase C, spec §6.2) --------
  ipo_enabled: true              # base.py fallback false
  ipo_listing_window_days: 90    # listings younger than this are tracker candidates
  ipo_max_deep_dives: 2          # reserved Stage-3 slots (WITHIN deep_dive_count budget)
  ipo_lockin_warn_days: 7        # flag anchor/pre-IPO lock-in expiries within N days
  ipo_qib_weight: 3.0            # QIB subscription weighted 3x retail (spec §6.2)

# ── PI Prospect — IPO intelligence (spec 2026-08-11) ────────────────────────
ipo:
  enabled: true
  refresh_hour: 8               # daily calendar+ladder refresh (IST)
  refresh_hour_live: 17         # second pass, after the 17:00 NSE bid update
  refresh_minute_live: 45       # 17:45 — strictly before Sunday's 18:00 weekly_review
  bid_ladder_enabled: true      # kill-switch for the per-symbol ladder fetch
  max_ladder_fetches: 10        # cap per refresh — one NSE call per open issue
  cache_max_age_hours: 48       # watchdog invariant threshold
  # ── P2 capture (design §5 P2) ──
  signals_enabled: true         # append a snapshot per issue per refresh pass
  signal_retention_days: 400    # >365 so P4 can read a full convergence year

generic_graph:
  # Neutral 8-dimension weights for sectors without a native graph (must sum to 1.0).
  agent_weights:
    business: 0.14
    fundamentals: 0.18
    valuation: 0.14
    technical: 0.12
    macro: 0.12
    risk: 0.12
    management: 0.09
    earnings: 0.09

# =============================================================================
# Compass Phase C — M4 proactive delivery (spec 2026-07-06 §7)
# Secrets (SMTP_*, VAPID_*, DELIVERY_EMAIL_TO) stay in .env — NEVER here.
# =============================================================================
delivery:
  enabled: true                  # master gate: scheduler Jobs 13/14 + all channel sends
  data_dir: "data/delivery"      # push_subscriptions.json, alerts_sent.jsonl
  email_enabled: false           # flip after SMTP_* secrets are set in .env / Railway
  push_enabled: true             # degrades silently until VAPID_* secrets are set
  index_watch:                   # weekly constituent diff -> inclusion/exclusion alerts
    - "NIFTY 50"
    - "NIFTY NEXT 50"
    - "NIFTY MIDCAP 150"
    - "NIFTY SMALLCAP 250"
  # Atlas C7 (BP2) durable outbox — active only when ATLAS_ENABLED. The drainer
  # runs in the singleton-lock owner and retries with backoff -> dead-letter.
  outbox_max_attempts: 3         # sends before a row is dead-lettered
  outbox_backoff_minutes: [1, 5, 30]   # per-attempt reschedule delay
  outbox_poll_seconds: 30        # drainer loop interval
  outbox_retention_days: 30      # C9 prunes delivered/dead rows older than this
  # Morning-brief rendering (redesign 2026-07-27)
  brief_max_overnight: 3               # overnight items shown after dedup
  brief_overnight_dedup_threshold: 0.6 # Jaccard token-similarity = "same story"
  brief_overnight_maxlen: 240          # length safety-net trim for a headline
  brief_max_ideas: 5                   # discovery ideas shown
  brief_idea_reason_maxlen: 180        # per-idea reason line cap
  brief_max_ipos: 3                    # IPOs shown after dedup
  weekly_max_ipos: 6                   # IPO rows in the weekly digest
  # Brief enhancements (2026-07-28): earnings-why, IPO lean
  brief_ipo_strong_demand_x: 10.0      # total-x at/above => STRONG lean
  brief_ipo_strong_qib_x: 15.0         # qib-x at/above => STRONG lean
  brief_ipo_soft_demand_x: 2.0         # total-x AND qib-x below => SOFT lean
  brief_earnings_watch_maxlen: 120     # cap for the earnings "watch" line
  brief_html_enabled: true             # send the styled HTML email part (false => text-only email; one-line revert)
  # Overnight de-dup (2026-07-30): cluster near-duplicate stories by salient entity
  brief_overnight_dedup_min_shared_entities: 2   # >= this many shared salient entities => same story
  brief_overnight_stopwords: [the, a, an, of, for, to, in, on, and, or, as, at, by,
    with, from, up, its, into, over, without, amid, new, plan, move, step, measure,
    raise, boost, increase, hike, support, ease, rbi, govt, government, india, indian,
    market, stock, share, sensex, nifty]

# =============================================================================
# Atlas M1 — user-plane relational core (data/atlas.db). Ships DORMANT: the whole
# Phase-C build is a behavioral no-op until `enabled` is flipped at the weekend
# cutover (env ATLAS_ENABLED wins over this file). enabled=false = instant
# rollback to the JSON / users.db / dir-scan path.
# =============================================================================
atlas:
  # THE C11 CUTOVER SWITCH. Flip to `true` HERE and push — that is the whole
  # step. Railway is NOT required: the code reads
  # cfg("atlas.enabled", env="ATLAS_ENABLED", fallback=False), and the env var
  # is only an override that prod does not set, so this yaml value is what is
  # actually in force. (The old comment here said "via ATLAS_ENABLED in
  # Railway", which sent several sessions hunting for a dashboard step that
  # was never necessary.)
  # Rollback is the same edit in reverse.
  enabled: false
  db_path: "data/atlas.db"
  feedback:                      # BP5 accept/override events (Atlas C8)
    aggregation_floor_users: 20  # refuse to return an aggregate below this many distinct users (privacy)
  retention:                     # C9 nightly prune caps — null = keep-all
    ticker_verdicts_days: 400    # drop projections older than this
    value_history_cap: 400       # keep the last N daily value points per user
    source_decommission_days: 14 # C11 step 6: keep legacy users.db/watchlist.json/push_subscriptions.json/managed_tickers.json read-only this many days of green atlas operation before removal
    # outbox delivered/dead prune uses delivery.outbox_retention_days (30) above

# ---------------------------------------------------------------------------
# Verification layer — the deterministic auditor (design 2026-08-07).
# Read-only: these tunables change what it REPORTS and ALERTS on, never what
# the system decides. No env= on any of them (config.yaml is the sole source).
# ---------------------------------------------------------------------------
audit:
  enabled: true                # master switch for the nightly grading job
  alerts_enabled: true         # kill-switch for breach alerts only
  benchmark_ticker: "^NSEI"    # NIFTY 50 — the benchmark `correct` is defined against
  horizons_td: [10, 30, 60]    # trading days after issue
  min_n: 30                    # below this, every verdict is INSUFFICIENT_DATA
  min_hit_rate_60d: 0.45       # 60td hit-rate floor before a warning fires
  max_bench_lag_pct: 10.0      # portfolio trailing NIFTY by more than this over 60d
  max_news_blind_rate: 0.20    # F1's blind-rate ceiling — currently log-only
  conviction_flat_spread: 1.0  # top-minus-bottom decile spread, in pp

# Universe demand model (BP1) — the nightly recompute (Atlas C4) turns held/watch
# refcounts into demand tiers. A watch-only ticker earns a DAILY slot only once its
# demand reaches one held-equivalent (the holders weight below); otherwise weekly.
universe:
  demand_weights:                # demand_score = holders*3 + watchers*1 + chat_hits_7d*0.5
    holders: 3
    watchers: 1
    chat_hits_7d: 0.5            # source deferred to M1.x (reviewer R4) — 0 until then
  max_daily_analyses: 25         # daily-cadence budget (held always daily; can exceed → governor)
  budget_alert_pct: 0.8          # ops alert when daily count >= this fraction of the budget
  archive_grace_days: 30         # refcount-0 + no history + archivable origin → archive after this
