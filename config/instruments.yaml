# SA-008 — security identity (src/backend/shared/data/instruments.py).
#
# One entry per app ticker whose identity is not simply "the NSE listing of
# the same name". Tickers not listed here resolve to "{TICKER}.NS".
# Evidence is required to RESOLVE an identity, never to quarantine one.
#
# segments: effective-dated, in order, not overlapping.
#   from / until  ISO dates; `from` inclusive, `until` exclusive; omit = open
#   status        active | unresolved | suspended | delisted
#                 (only `active` resolves; the others quarantine the ticker:
#                 no new-risk advice, no forecast, no learning — see the
#                 decision gate, `decision_gate.mode` in config.yaml)
#   symbol        the provider (Yahoo) symbol asked for data in this segment
#   basis         price-basis id (default: the symbol's root). Prices on
#                 different bases are never compared: a rename keeps the
#                 basis, a demerger or relisting starts a new one.
#   via           how an `active` symbol that is not the ticker's own listing
#                 relates to it: alias | rename | demerger | relisting
#   reason        required for an alias and for every non-active segment
#   evidence      required for rename / demerger / relisting and successors:
#                 [{source: ..., ref: ..., date: YYYY-MM-DD}] — primary
#                 exchange or company documents (circular number, filing)
#   successors    where holdings of the old basis go, for the operator's
#                 reconciliation (python -m core.portfolio.identity_reconcile):
#                 [{ticker: ..., ratio: new shares per old share,
#                   cost_fraction: share of the old cost basis}], fractions sum to 1
#
# Example of a resolved rename (illustrative, not a real company):
#   OLDCO:
#     segments:
#       - {until: 2026-03-02, status: active, symbol: OLDCO.NS, basis: OLDCO}
#       - {from: 2026-03-02, status: active, symbol: NEWCO.NS, basis: OLDCO, via: rename,
#          evidence: [{source: NSE circular, ref: "NSE/CML/2026/0000", date: 2026-02-20}]}

version: 1
instruments:
  # Owner's decision, 2026-09-29 (option b): the passenger-vehicle company is tracked as
  # its own listing, TMPV, which needs no record here. TATAMOTORS stays quarantined, so
  # its history is never graded or advised against another company's prices.
  TATAMOTORS:
    name: Tata Motors Ltd (pre-demerger listing)
    segments:
      - status: unresolved
        symbol: TMPV.NS
        basis: TMPV
        reason: >-
          retired by the owner's decision of 2026-09-29: the passenger-vehicle company is
          tracked as TMPV. Still priced from TMPV.NS, which the former YF_SYMBOL_OVERRIDES
          entry described as the passenger-vehicles entity after the 2025 demerger; no
          exchange evidence (effective date, successors, share ratio, cost split) is recorded
  TVSMOTORS:
    name: TVS Motor Company Ltd
    segments:
      - status: active
        symbol: TVSMOTOR.NS
        basis: TVSMOTOR
        via: alias
        reason: the NSE symbol is TVSMOTOR (no trailing S); the same listed security
  CANARABANK:
    name: Canara Bank
    segments:
      - status: active
        symbol: CANBK.NS
        basis: CANBK
        via: alias
        reason: NSE and Yahoo list Canara Bank as CANBK; the same listed security
  HEXAWARE:
    name: Hexaware Technologies Ltd
    segments:
      - status: unresolved
        symbol: HEXT.NS
        basis: HEXT
        reason: >-
          priced from HEXT.NS, the code the former YF_SYMBOL_OVERRIDES entry gave Hexaware;
          whether HEXT is a relisting of the HEXAWARE listing (and from which date) is not
          recorded with exchange evidence

  # Codes NSE renamed. Each NSE circular changes only the name and the trading symbol, and the
  # notice carries the ISIN NSE's equity list gives the new code today. NSE answers only the
  # new code, and Yahoo prices it (ICICILIFE.NS from 14 Oct 2026 so far). So the basis is kept,
  # and the code asked for the close and the corporate-action list is the new one on every date.
  PVR:
    name: PVR INOX Ltd (PVR Ltd until 2023; INOX Leisure merged into it)
    segments:
      - {until: 2023-05-12, status: active, symbol: PVR.NS, basis: PVR}
      - {from: 2023-05-12, status: active, symbol: PVRINOX.NS, basis: PVR, via: rename,
         evidence: [{source: NSE circular, ref: NSE/CML/56638, date: 2023-05-08}]}
  MCDOWELL-N:
    name: United Spirits Ltd
    segments:
      - {until: 2024-06-07, status: active, symbol: MCDOWELL-N.NS, basis: MCDOWELL-N}
      - {from: 2024-06-07, status: active, symbol: UNITDSPR.NS, basis: MCDOWELL-N, via: rename,
         evidence: [{source: NSE circular, ref: NSE/CML/62353, date: 2024-06-06}]}
  ZOMATO:
    name: Eternal Ltd (Zomato Ltd until 2025)
    segments:
      - {until: 2025-04-09, status: active, symbol: ZOMATO.NS, basis: ZOMATO}
      - {from: 2025-04-09, status: active, symbol: ETERNAL.NS, basis: ZOMATO, via: rename,
         evidence: [{source: NSE circular, ref: NSE/CML/67420, date: 2025-04-03}]}
  LTIM:
    name: LTM Ltd (LTIMindtree Ltd until 2026)
    segments:
      - {until: 2026-02-27, status: active, symbol: LTIM.NS, basis: LTIM}
      - {from: 2026-02-27, status: active, symbol: LTM.NS, basis: LTIM, via: rename,
         evidence: [{source: NSE circular, ref: NSE/CML/72948, date: 2026-02-23}]}
  ICICIPRULI:
    name: ICICI Life Insurance Ltd (ICICI Prudential Life Insurance Company Ltd until 2026)
    segments:
      - {until: 2026-10-23, status: active, symbol: ICICIPRULI.NS, basis: ICICIPRULI}
      - {from: 2026-10-23, status: active, symbol: ICICILIFE.NS, basis: ICICIPRULI, via: rename,
         evidence: [{source: NSE circular, ref: NSE/CML/76967, date: 2026-10-16}]}

  # Codes that no longer trade. NSE suspended each "on account of the Scheme of Amalgamation"
  # and lists neither today, and Yahoo has no price for either. Nothing is held, so no
  # successors are recorded.
  GATI:
    name: Allcargo Gati Ltd (GATI Ltd until 2023; amalgamated in 2025)
    segments:
      - {until: 2023-11-30, status: active, symbol: GATI.NS, basis: GATI}
      - {from: 2023-11-30, until: 2025-11-12, status: active, symbol: ACLGATI.NS, basis: GATI,
         via: rename, evidence: [{source: NSE circular, ref: NSE/CML/59502, date: 2023-11-24}]}
      - from: 2025-11-12
        status: delisted
        basis: GATI
        reason: >-
          NSE suspended trading in Allcargo Gati from 12 Nov 2025 on account of its scheme of
          amalgamation; the code no longer trades
        evidence: [{source: NSE notice, ref: Suspension of Trading (ACLGATI), date: 2025-11-06}]
  INOXLEISUR:
    name: INOX Leisure Ltd (merged into PVR Ltd in 2023)
    segments:
      - {until: 2023-02-17, status: active, symbol: INOXLEISUR.NS, basis: INOXLEISUR}
      - from: 2023-02-17
        status: delisted
        basis: INOXLEISUR
        reason: >-
          NSE suspended trading in INOX Leisure from 17 Feb 2023 on account of its amalgamation
          into PVR Ltd; the code no longer trades
        evidence: [{source: NSE notice, ref: Suspension of Trading (INOXLEISUR), date: 2023-02-14}]
