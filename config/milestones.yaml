# Authoritative registry of date-bound milestones and standing invariants.
# Read by the ops_watchdog scheduler job (06:30 IST daily).
#
# THIS FILE IS THE SOURCE OF TRUTH. Claude's memory files must point here
# rather than carry their own dates. A new milestone lands in the SAME commit
# as the work that creates it.
#
# Why it exists: on 2026-08-08 the Atlas C11 cutover window lapsed, and again
# on 8/09, and it was noticed on 8/10 only because a human happened to ask.
# Every milestone lived in memory files that prod cannot read.
#
# Reaches prod only on deploy — the deploy_matches_origin invariant guards that.
#
# Fields: id, kind, title, check are required. Optional: prep, window,
# deadline, lead_days (default 3), schedule (daily|monthly), action, docs.
#
# A `manual_confirmation` entry stays pending until it is DELETED here, and once
# its deadline passes it re-sends a critical alert every 7 days. Judge it, then
# delete it with the evidence or the decision recorded where the work is tracked,
# or re-date it with a dated reason at the head of its action text. Never delete
# one just to silence it. SA-038 judged the entries that lapsed in Aug-Sep 2026:
# docs/planning/PI-2026-09/evidence/SA-038-implementation.md.

milestones:
  - id: ipo_verdicts_visible_gate
    kind: milestone
    title: "IPO P3 — decide whether verdicts may be shown to a user"
    check: manual_confirmation
    deadline: 2026-12-31
    lead_days: 5
    action: >
      P3 writes verdicts to data/ipo/ipo_verdicts.jsonl and shows NOTHING.
      Spec section 5 P5 conditions the visible flip on a MEASURED hit-rate, and
      the backtest alone does not qualify: the P1 spine holds FINAL
      subscription, known at close of day 3, while the deep dive fires at T-1
      on interim demand the spine cannot see. The verdict records which case it
      is in `short.evidenced` — flip only what that flag admits.
      JUDGE THIS WHEN 60 days of forward P2 rows have accrued, or on the
      deadline above, whichever comes FIRST.
      The gate: on rows where short.evidenced is true (the post-close
      listing-day lean), does the forward hit-rate match the historical
      92% positive for `strong` (demand >= 70) and 34% for `weak`
      (demand <= 30)? Compare against config.yaml ipo.short_cohorts, which
      carries the n behind each figure.
      If it holds, IPO-5b may show the verdict and the quadrant. If it does
      not, P3 stays dark and the anchors get re-read against the wider
      production spine — a miss is a real result, not a reason to ship anyway.
      The T-1 lean stays dark REGARDLESS; it is not what this measures.
      IPO-5a (sourced research notes, no verdict claim) is not gated on any of
      this and may ship first.
      Remove this entry once judged.
    docs: docs/superpowers/plans/2026-09-21-ipo-prospect-p3-substance.md

invariants:
  - id: ipo_cache_fresh
    kind: invariant
    title: "IPO calendar cache is being refreshed"
    check: ipo_cache_fresh
    action: >
      The twice-daily ipo_refresh job has stopped. The brief keeps rendering
      stale issues with no error, so this is silent without the watchdog.
      Check the scheduler job ids ipo_refresh_am / ipo_refresh_pm.
    docs: docs/superpowers/specs/2026-08-11-ipo-intelligence-design.md

  - id: ipo_signals_accruing
    kind: invariant
    title: "IPO capture ledger is accruing snapshots"
    check: ipo_signals_accruing
    action: >
      An IPO window is open but the P2 capture ledger has no snapshot for it.
      The perishable demand data for this window is being lost and cannot be
      recovered later. Check ipo.signals_enabled in config.yaml and that
      data/ipo/ipo_signals.jsonl is writable on the volume.
    docs: docs/superpowers/specs/2026-08-11-ipo-intelligence-design.md

  - id: registry_is_current
    kind: invariant
    title: "Deployed registry matches origin/main"
    check: registry_is_current
    action: >
      A milestone was added or changed on origin/main but never deployed,
      so the watchdog is blind to it. Redeploy. (This compares the registry
      FILE, not the commit SHA — holding unrelated commits back is fine.)

  - id: serper_month_rollover
    kind: invariant
    title: "Serper quota counter rolled into the current month"
    check: serper_counter_current_month
    schedule: monthly
    action: "Inspect data/logs/api_usage.json on the volume."

  - id: monthly_scorecard_written
    kind: invariant
    title: "Previous month's RL scorecard was written"
    check: monthly_scorecard_written
    schedule: monthly
    action: >
      Check the 1st-of-month scorecard job ran. Note the file is named for
      the COMPLETED month, so in September look for 2026-08_scorecard.json.

  - id: users_mirrored
    kind: invariant
    title: "Every account is mirrored into the Atlas fan-out set"
    check: users_mirrored
    action: >
      Signup writes users.db; the brief and autopilot fan out over atlas.db.
      An account missing from atlas.db can log in and receives nothing.
      Re-run scripts/atlas_etl.py on prod (idempotent) to repair.
      Silent until atlas.enabled is true — pre-cutover users.db IS the store.
    docs: docs/superpowers/specs/2026-08-11-atlas-signup-user-mirror-design.md

  - id: backup_recoverable
    kind: invariant
    title: "Nightly backup passed its restore drill and is confirmed off-site"
    check: backup_recoverable
    action: >
      SA-007. Read data/backups/backup_status.json on the volume. A failed
      drill names the file and check that failed; fix that before trusting the
      archive. "not configured" means the off-site bucket and
      BACKUP_ENCRYPTION_KEY were never set: the runbook is in KT section 10
      (docs/TECHNICAL_DESIGN.md). The owner deferred that to the end of the
      PI, so it is repeated weekly; every other problem here warns daily.
      Any other reason is the store's scrubbed
      error. A ledger that shrank or was rewritten since the previous archive
      means history was lost on the volume: older off-site copies still hold
      it. Off-site recovery counts as verified only after a recorded
      `python -m services.data.restore fetch` into an empty directory.
    docs: docs/TECHNICAL_DESIGN.md

  - id: audit_graded_when_due
    kind: invariant
    title: "Auditor grades rows once they mature"
    check: audit_graded_when_due
    action: >
      Matured rows are not being graded. Check the ^NSEI benchmark fetch
      (the 2026-08-07 failure mode) before trusting any audit verdict.

  - id: switch_lane_has_sample
    kind: invariant
    title: "Switch validation has enough evidence to speak"
    check: switch_lane_has_sample
    schedule: monthly
    action: >
      Nothing to do — this is an accrual gate, not a failure. It closes by
      itself once enough non-overlapping switch pairs have matured, and that is
      the day the "do switch ideas actually work out?" question first has an
      answer. Investigate ONLY if n_effective stops rising: that means capture
      stopped (advisor.switch_eval_enabled) or grading stopped
      (audit.switch_lane_enabled).
    docs: docs/superpowers/specs/2026-08-20-switch-validation-design.md
