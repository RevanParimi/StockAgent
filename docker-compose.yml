# ============================================================
# StockAgent — self-hosted / local Docker Compose
#
# NOTE ON PRODUCTION: production runs on Railway, not Compose — a single
# Python process serving FastAPI with the scheduler running as an in-process
# thread. This file exists for local full-stack runs and as a self-hosting
# path; it is not what deploys today.
#
# Usage:
#   cp .env .env.production          # fill in real API keys
#   docker compose --env-file .env.production up -d --build
#
# Volumes (all survive restarts / rebuilds):
#   stockagent_data  → /app/data   (predictions, chroma_db, scores.db, KB docs)
#   stockagent_logs  → /app/logs
#   stockagent_out   → /app/outputs
#
# History: this file used to describe a DigitalOcean Droplet topology with a
# TypeScript gateway behind a Caddy reverse proxy. Both are gone — the
# gateway was deleted in 931da78 (its routes were passthroughs to Python; its
# one non-trivial job, per-ticker WebSocket fan-out, now lives in
# services/api/routes/stream.py) and the Caddyfile in d4792e4 (Railway
# terminates TLS). Their service blocks were removed here so the file
# describes something that can actually start.
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # Python FastAPI — agent orchestrator + RL feedback loop
  # Serves the API, the PWA, and the in-process job scheduler.
  # Includes compiled C++ pybind11 indicators (multi-stage build)
  # ──────────────────────────────────────────────────────────
  python-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CPP: "true"
    container_name: stockagent-python
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      PREDICTION_DATA_DIR: /app/data/predictions
      SCORE_DB_PATH: /app/data/scores.db
      LOG_FILE: /app/logs/stockagent.log
      OUTPUT_DIR: /app/outputs
      RAG_DOCUMENTS_BASE_DIR: /app/data
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    volumes:
      - stockagent_data:/app/data
      - stockagent_logs:/app/logs
      - stockagent_out:/app/outputs
    ports:
      # Published directly — there is no reverse proxy in front of it here.
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # C# Quartz.NET Scheduler — dormant.
  # Superseded by the in-process Python scheduler; the source is still in
  # the tree, so this is kept behind an opt-in profile rather than deleted.
  #   docker compose --profile csharp up -d
  # ──────────────────────────────────────────────────────────
  csharp-scheduler:
    profiles: ["csharp"]
    build:
      context: services/csharp/StockAgent.Scheduler
      dockerfile: Dockerfile
    container_name: stockagent-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      PYTHON_API_URL: http://python-api:8000
      CSHARP_SCHEDULER_ENABLED: "true"
    expose:
      - "5000"
    depends_on:
      python-api:
        condition: service_healthy

# ============================================================
# Named volumes — persisted across all restarts
# ============================================================
volumes:
  stockagent_data:
    driver: local
  stockagent_logs:
    driver: local
  stockagent_out:
    driver: local

# ============================================================
# Internal network — services talk by name, nothing exposed raw
# ============================================================
networks:
  default:
    name: stockagent-net
