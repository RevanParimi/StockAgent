<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>StockAgent · Components</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    'bg-base':'#050810','bg-surface':'#0c1120','bg-elevated':'#111827',
    'border-color':'#1e293b','border-glow':'#334155',
    'accent-blue':'#3b82f6','accent-cyan':'#06b6d4','accent-violet':'#8b5cf6',
    'buy-strong':'#22c55e','buy':'#4ade80','neutral-color':'#f59e0b','sell':'#f97316','sell-strong':'#ef4444',
    'text-primary':'#f1f5f9','text-secondary':'#94a3b8','text-muted':'#475569',
  }, fontFamily:{ sans:['Inter','sans-serif'], mono:['JetBrains Mono','monospace']}}}};
</script>
<style>
  body { background:#050810; color:#f1f5f9; font-family:'Inter',sans-serif; margin:0; padding:40px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .eyebrow { font: 700 10px/1 'JetBrains Mono',monospace; letter-spacing:.25em; color:#06b6d4; text-transform:uppercase; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin: 10px 0 6px; }
  p.lede { color: #94a3b8; font-size: 14px; max-width: 720px; margin: 0 0 28px; }
  h2 { font: 700 11px/1 'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:#94a3b8; margin: 36px 0 14px; }
  @keyframes shimmer-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .shimmer-bar { animation: shimmer-bar 1.2s infinite ease-in-out; }
  @keyframes pulse-ring { 0%,100% { box-shadow:0 0 0 0 rgba(6,182,212,0.4);} 50%{ box-shadow:0 0 0 6px rgba(6,182,212,0);} }
  .pulse-ring { animation: pulse-ring 1.6s infinite; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Components</div>
  <h1>Building blocks of the Analyze surface.</h1>
  <p class="lede">Buttons, glass cards, verdict badges, agent tiles and the score gauge. Every component obeys the same two rules: glow means verdict, cyan means action.</p>

  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../ui_kits/stockagent/Data.jsx"></script>
<script type="text/babel" src="../ui_kits/stockagent/Icons.jsx"></script>
<script type="text/babel" src="../ui_kits/stockagent/Primitives.jsx"></script>
<script type="text/babel" src="../ui_kits/stockagent/ScoreGauge.jsx"></script>
<script type="text/babel" src="../ui_kits/stockagent/AgentCard.jsx"></script>
<script type="text/babel" src="../ui_kits/stockagent/StreamProgress.jsx"></script>

<script type="text/babel">
const Section = ({ title, children }) => (
  <>
    <h2>{title}</h2>
    <div style={{display:'grid',gap:'14px'}}>{children}</div>
  </>
);

const ComponentsPage = () => (
  <>
    <Section title="Verdict Badges">
      <div className="flex flex-wrap gap-3 items-center">
        <VerdictBadge verdict="STRONG BUY" />
        <VerdictBadge verdict="BUY" />
        <VerdictBadge verdict="NEUTRAL" />
        <VerdictBadge verdict="SELL" />
        <VerdictBadge verdict="STRONG SELL" />
        <span className="text-[11px] font-mono text-text-muted ml-4">· default size</span>
      </div>
      <div className="flex flex-wrap gap-3 items-center mt-2">
        <VerdictBadge verdict="STRONG BUY" size="lg" glow />
        <VerdictBadge verdict="BUY" size="lg" glow />
        <VerdictBadge verdict="NEUTRAL" size="lg" glow />
        <VerdictBadge verdict="SELL" size="lg" glow />
        <VerdictBadge verdict="STRONG SELL" size="lg" glow />
        <span className="text-[11px] font-mono text-text-muted ml-4">· lg + glow (verdict hero)</span>
      </div>
    </Section>

    <Section title="Buttons">
      <div className="flex flex-wrap gap-3 items-center">
        <GlowButton variant="cyan">Run agents</GlowButton>
        <GlowButton variant="cyan" size="lg"><IconZap size={16}/> Analyze MARUTI</GlowButton>
        <GlowButton variant="blue">Secondary</GlowButton>
        <GlowButton variant="violet">Premium</GlowButton>
        <GlowButton variant="outline"><IconRefresh size={14}/> Re-run</GlowButton>
        <GlowButton variant="cyan" size="sm"><IconDownload size={12}/> Export</GlowButton>
        <GlowButton variant="cyan" disabled>Disabled</GlowButton>
      </div>
    </Section>

    <Section title="Glass Card">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <GlassCard>
          <div className="text-[10px] font-bold tracking-widest text-text-muted uppercase">Portfolio mood</div>
          <div className="font-mono text-3xl font-extrabold tabular-nums mt-2" style={{color:'#22c55e'}}>0.74</div>
          <div className="text-xs text-text-secondary mt-1">Weighted across 5 tickers</div>
        </GlassCard>
        <GlassCard hover>
          <div className="text-[10px] font-bold tracking-widest text-text-muted uppercase">Hover card</div>
          <div className="text-sm text-text-primary mt-2">Borders brighten to #334155 on hover.</div>
          <div className="text-xs text-text-muted mt-1 font-mono">hover={"{true}"}</div>
        </GlassCard>
        <GlassCard style={{boxShadow:'0 0 20px rgba(34,197,94,0.4)',borderColor:'rgba(34,197,94,0.4)'}}>
          <div className="text-[10px] font-bold tracking-widest text-text-muted uppercase">With verdict glow</div>
          <div className="text-sm text-text-primary mt-2">Glow = signal. Never decorative.</div>
          <VerdictBadge verdict="STRONG BUY" size="sm" />
        </GlassCard>
      </div>
    </Section>

    <Section title="ScoreGauge">
      <div className="flex flex-wrap gap-6 justify-start">
        <GlassCard><ScoreGauge score={0.82} size={200} label="STRONG BUY" /></GlassCard>
        <GlassCard><ScoreGauge score={0.68} size={200} label="BUY" /></GlassCard>
        <GlassCard><ScoreGauge score={0.50} size={200} label="NEUTRAL" /></GlassCard>
        <GlassCard><ScoreGauge score={0.36} size={200} label="SELL" /></GlassCard>
        <GlassCard><ScoreGauge score={0.18} size={200} label="STRONG SELL" /></GlassCard>
      </div>
    </Section>

    <Section title="AgentCard · all three states">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <AgentCard agentKey="pattern_analysis" label="Pattern Analysis" icon="🔍" state="pending" weight={0.13} />
        <AgentCard agentKey="fundamentals"     label="Fundamentals"     icon="📈" state="analyzing" weight={0.20} />
        <AgentCard agentKey="sales_demand"     label="Sales & Demand"   icon="📊" state="complete" score={0.85} weight={0.18} />
      </div>
    </Section>

    <Section title="StreamProgress">
      <StreamProgress total={8} complete={0} elapsed={0} running={false}/>
      <StreamProgress total={8} complete={3} elapsed={18} running={true} currentAgent="raw_materials"/>
      <StreamProgress total={8} complete={8} elapsed={47} running={false}/>
    </Section>

    <Section title="Chips & stats">
      <div className="flex flex-wrap gap-2 items-center">
        <span className="inline-flex items-center gap-1 text-[10px] font-mono font-bold tracking-wider uppercase text-text-muted bg-[rgba(255,255,255,0.03)] border border-[#1e293b] rounded-full px-2.5 py-1">NSE</span>
        <span className="inline-flex items-center gap-1 text-[10px] font-mono font-bold tracking-wider uppercase text-accent-cyan bg-[rgba(6,182,212,0.08)] border border-[rgba(6,182,212,0.3)] rounded-full px-2.5 py-1">● Live</span>
        <span className="inline-flex items-center gap-1 text-[10px] font-mono font-bold tracking-wider uppercase text-text-muted bg-[rgba(255,255,255,0.03)] border border-[#1e293b] rounded-full px-2.5 py-1"><IconClock size={10}/> 47s</span>
        <span className="inline-flex items-center gap-1 text-[10px] font-mono font-bold tracking-wider uppercase text-buy bg-[rgba(74,222,128,0.08)] border border-[rgba(74,222,128,0.3)] rounded-full px-2.5 py-1"><IconTrendUp size={10}/> +1.24%</span>
        <span className="inline-flex items-center gap-1 text-[10px] font-mono font-bold tracking-wider uppercase text-sell bg-[rgba(249,115,22,0.08)] border border-[rgba(249,115,22,0.3)] rounded-full px-2.5 py-1"><IconTrendDn size={10}/> -0.67%</span>
      </div>
    </Section>

    <Section title="Input">
      <GlassCard className="!p-0 overflow-hidden">
        <div className="flex items-center gap-3 px-4 py-3.5">
          <IconSearch size={18} stroke="#94a3b8"/>
          <input defaultValue="TATAMOTORS" className="flex-1 bg-transparent outline-none text-text-primary font-mono text-base font-semibold tracking-wide"/>
          <kbd className="font-mono text-[10px] text-text-muted bg-[rgba(255,255,255,0.04)] border border-[#1e293b] rounded px-1.5 py-0.5">⏎</kbd>
          <GlowButton variant="cyan" size="sm">Run</GlowButton>
        </div>
      </GlassCard>
    </Section>
  </>
);

ReactDOM.createRoot(document.getElementById('root')).render(<ComponentsPage/>);
</script>
</body>
</html>
