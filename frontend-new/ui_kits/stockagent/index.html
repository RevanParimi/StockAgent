<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockAgent · Analyze — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-base': '#050810', 'bg-surface': '#0c1120', 'bg-elevated': '#111827',
          'border-color': '#1e293b', 'border-glow': '#334155',
          'accent-blue': '#3b82f6', 'accent-cyan': '#06b6d4', 'accent-violet': '#8b5cf6',
          'buy-strong': '#22c55e', 'buy': '#4ade80',
          'neutral-color': '#f59e0b', 'sell': '#f97316', 'sell-strong': '#ef4444',
          'text-primary': '#f1f5f9', 'text-secondary': '#94a3b8', 'text-muted': '#475569',
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html, body { background: #050810; color: #f1f5f9; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #050810; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  @keyframes shimmer-bar {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .shimmer-bar { animation: shimmer-bar 1.2s infinite ease-in-out; }
  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.4); }
    50%      { box-shadow: 0 0 0 6px rgba(6,182,212,0); }
  }
  .pulse-ring { animation: pulse-ring 1.6s infinite; }
  @keyframes float-slow {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .float-slow { animation: float-slow 4s ease-in-out infinite; }
  :focus-visible { outline: 2px solid #06b6d4; outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Data.jsx"></script>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="ScoreGauge.jsx"></script>
<script type="text/babel" src="AgentCard.jsx"></script>
<script type="text/babel" src="StreamProgress.jsx"></script>
<script type="text/babel" src="VerdictReveal.jsx"></script>
<script type="text/babel" src="AgentRadar.jsx"></script>
<script type="text/babel" src="ScoreTable.jsx"></script>
<script type="text/babel" src="ConvictionPanel.jsx"></script>
<script type="text/babel" src="ThesisCard.jsx"></script>
<script type="text/babel" src="HistoryLine.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
