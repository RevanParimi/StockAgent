<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  #sa-loading {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: var(--bg-base, #f6f7fb);
    transition: opacity .3s;
  }
  #sa-loading.fade { opacity: 0; pointer-events: none; }
  .sa-loader-ring {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(8,145,178,.15);
    border-top-color: #0891b2;
    animation: spin-slow .9s linear infinite;
  }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Full-screen loader shown while bootstrap fetch runs -->
<div id="sa-loading">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="sa-loader-ring"></div>
    <div style="font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#0891b2;letter-spacing:.04em">
      StockAgent loading…
    </div>
  </div>
</div>

<div id="root"></div>

<!-- Component scripts load in dependency order -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sphere.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="agents-page.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>
<script type="text/babel" src="learn.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "sphereMode": "wireframe",
  "density": "comfy"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('auth');
  const [chat, setChat] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  const goHome   = () => setScreen('home');
  const goAgents = () => setScreen('agents');
  const openChat = () => setChat(true);
  const closeChat = () => setChat(false);

  return <>
    {screen === 'auth'      && <AuthScreen onAuthed={goHome}/>}
    {screen === 'home'      && <Home onNav={setScreen} openChat={openChat}/>}
    {screen === 'agents'    && <AgentsPage onNav={setScreen} goHome={goHome} openChat={openChat}/>}
    {screen === 'portfolio' && <PortfolioPage onNav={setScreen} openChat={openChat}/>}
    {screen === 'learn'     && <LearnPage onNav={setScreen} openChat={openChat}/>}

    {screen !== 'auth' && !chat && <SphereOrb onOpen={openChat} mode={tweaks.sphereMode}/>}
    <ChatOverlay open={chat} onClose={closeChat} mode={tweaks.sphereMode}/>

    {/* Bottom nav strip */}
    {screen !== 'auth' && (
      <div style={{
        position:'fixed', left:24, bottom:24, zIndex:55,
        display:'flex', gap:6, padding:6, background:'var(--bg-surface)',
        border:'1px solid var(--border)', borderRadius:999, boxShadow:'var(--shadow-md)'
      }}>
        <NavChip active={screen==='home'}      onClick={goHome}                    icon={<Icon.Home size={14}/>}      label="Home"/>
        <NavChip active={screen==='agents'}    onClick={goAgents}                  icon={<Icon.Cpu size={14}/>}       label="Agents"/>
        <NavChip active={screen==='portfolio'} onClick={()=>setScreen('portfolio')} icon={<Icon.Briefcase size={14}/>} label="Portfolio"/>
        <NavChip active={screen==='learn'}     onClick={()=>setScreen('learn')}    icon={<Icon.Book size={14}/>}      label="Learn"/>
        <NavChip                               onClick={()=>setScreen('auth')}     icon={<Icon.User size={14}/>}      label="Sign out"/>
        {window.__LIVE_DATA && (
          <span style={{
            alignSelf:'center', padding:'3px 8px', borderRadius:999, fontSize:10, fontWeight:700,
            background:'var(--buy-soft)', color:'var(--buy-strong)', marginLeft:4
          }}>● LIVE</span>
        )}
      </div>
    )}

    <TweaksPanel title="Tweaks">
      <TweakSection title="Theme">
        <TweakRadio value={tweaks.theme} options={[{value:'light',label:'Light'},{value:'dark',label:'Dark'}]}
          onChange={v=>setTweak('theme', v)}/>
      </TweakSection>
      <TweakSection title="Sphere style">
        <TweakRadio value={tweaks.sphereMode} options={[{value:'wireframe',label:'Wireframe'},{value:'liquid',label:'Liquid'}]}
          onChange={v=>setTweak('sphereMode', v)}/>
      </TweakSection>
      <TweakSection title="Density">
        <TweakRadio value={tweaks.density} options={[{value:'comfy',label:'Comfy'},{value:'cozy',label:'Cozy'},{value:'dense',label:'Dense'}]}
          onChange={v=>setTweak('density', v)}/>
      </TweakSection>
      <TweakSection title="Quick jump">
        <TweakButton onClick={()=>setScreen('auth')}>Auth screen</TweakButton>
        <TweakButton onClick={goHome}>Home</TweakButton>
        <TweakButton onClick={goAgents}>Agents</TweakButton>
        <TweakButton onClick={()=>setScreen('portfolio')}>Portfolio</TweakButton>
        <TweakButton onClick={()=>setScreen('learn')}>Learn</TweakButton>
      </TweakSection>
      <TweakSection title="Data">
        <div style={{fontSize:11,color:'var(--ink-3)',padding:'4px 0'}}>
          {window.__LIVE_DATA ? '✓ Live data from API' : '⚠ Mock data (API offline)'}
        </div>
      </TweakSection>
    </TweaksPanel>
  </>;
}

function NavChip({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} style={{
      display:'flex', alignItems:'center', gap:6, padding:'7px 12px', borderRadius:999,
      border:'none', background: active ? 'var(--bg-tinted)' : 'transparent',
      color: active ? 'var(--ink-1)' : 'var(--ink-2)',
      fontSize:12, fontWeight:600
    }}>{icon} {label}</button>
  );
}

// ── Async bootstrap then mount ────────────────────────────────────────────
// 1. data.jsx sets mock window.* synchronously (already done by the time we get here)
// 2. We call window.__bootstrap() which tries to fetch /ui/bootstrap
// 3. Whether it succeeds or fails, we then mount React and fade the loader out

(async function () {
  await window.__bootstrap();                           // overlay mocks with live data (or no-op on error)

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  // Fade loader out after React has painted its first frame
  requestAnimationFrame(() => {
    const loader = document.getElementById('sa-loading');
    if (loader) {
      loader.classList.add('fade');
      setTimeout(() => loader.remove(), 350);
    }
  });
})();
</script>
</body>
</html>
