[tool.pytest.ini_options]
# Both the project root (for legacy core.*, services.* imports during migration)
# and src/ (for new backend.* imports) are added to sys.path.
pythonpath = [".", "src"]
testpaths  = ["tests"]

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name    = "stockai"
version = "0.1.0"

[tool.setuptools.packages.find]
# Once migration is complete, switch to ["src"] only.
where = [".", "src"]
