<meta name="apple-mobile-web-app-capable" content="yes"/>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (e) {
        console.warn('SW registration failed', e);
      });
    });
  }

  /* Compass Phase C — web-push (M4). Exposed as window.saPush so the in-app
   * Notifications setting (hamburger menu) can read status and toggle the
   * subscription. No floating button — the menu owns the UI now. */
  function saUrlB64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  window.saPush = {
    supported() {
      return ('serviceWorker' in navigator) && ('PushManager' in window)
        && ('Notification' in window);
    },
    // Returns 'on' | 'off' | 'denied' | 'unsupported'.
    async status() {
      if (!this.supported()) return 'unsupported';
      if (Notification.permission === 'denied') return 'denied';
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        return sub ? 'on' : 'off';
      } catch (e) { return 'off'; }
    },
    // Subscribe. Returns 'on' | 'denied' | 'unconfigured' | 'unsupported'.
    async enable() {
      if (!this.supported()) return 'unsupported';
      const reg = await navigator.serviceWorker.ready;
      const resp = await fetch('/delivery/push/public-key');
      const { public_key } = await resp.json();
      if (!public_key) return 'unconfigured';
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return 'denied';
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: saUrlB64ToUint8Array(public_key),
      });
      await fetch('/delivery/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub.toJSON()),
      });
      return 'on';
    },
    // Unsubscribe locally + on the server. Returns 'off'.
    async disable() {
      if (!this.supported()) return 'off';
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          const endpoint = sub.endpoint;
          await sub.unsubscribe();
          await fetch('/delivery/push/subscribe?endpoint=' + encodeURIComponent(endpoint),
            { method: 'DELETE' });
        }
      } catch (e) { console.warn('push disable failed', e); }
      return 'off';
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script>
  // Configure marked: no extra blank lines in output, use inline HTML
  if (window.marked) {
    window.marked.setOptions({ breaks: true, gfm: true });
  }
</script>
<script>
  /* Wave B (AUD-099/102): attach X-Scheduler-Key to same-origin API calls.
     The key is optional — when the server has no SCHEDULER_KEY set, requests
     work without it. Set it once via the prompt that appears on a 403, or
     manually: saSetKey('your-key'). */
  (function () {
    const realFetch = window.fetch.bind(window);
    window.saSetKey = function (k) {
      if (k) localStorage.setItem('sa_key', k);
      else localStorage.removeItem('sa_key');
    };
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : ((input && input.url) || '');
      const sameOrigin = url.startsWith('/') || url.startsWith(window.location.origin);
      const key = localStorage.getItem('sa_key');
      if (sameOrigin && key) {
        init = init || {};
        init.headers = Object.assign({}, init.headers || {}, { 'X-Scheduler-Key': key });
      }
      const resp = await realFetch(input, init);
      if (resp.status === 403 && sameOrigin && !window.__saKeyPrompting) {
        window.__saKeyPrompting = true;
        try {
          const entered = window.prompt('This action needs the API key. Enter it to unlock:');
          if (entered && entered.trim()) {
            window.saSetKey(entered.trim());
            return window.fetch(input, init);
          }
        } finally {
          window.__saKeyPrompting = false;
        }
      }
      return resp;
    };
  })();
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sphere.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="agents-page.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>
<script type="text/babel" src="learn.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="prompt-lab.jsx"></script>
<script type="text/babel" src="analytics.jsx"></script>
<script type="text/babel" src="logs.jsx"></script>
<script type="text/babel" src="rl-data.jsx"></script>
<script type="text/babel" src="rl-monitor.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "sphereMode": "wireframe",
  "density": "comfy"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('auth');
  const [chat, setChat] = useState(false);
  const [, forceRender] = useState(0);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  // Re-render with live API data once bootstrap fetch completes
  useEffect(() => {
    window.__onApiReady = () => forceRender(n => n + 1);
    if (window.__apiReady) forceRender(n => n + 1);
    return () => { window.__onApiReady = null; };
  }, []);

  const goHome = () => setScreen('home');
  const goAgents = () => setScreen('agents');
  const openChat = () => setChat(true);
  const closeChat = () => setChat(false);

  return <>
    {screen === 'auth' && <AuthScreen onAuthed={goHome}/>}
    {screen === 'home' && <Home onNav={setScreen} openChat={openChat}/>}
    {screen === 'agents' && <AgentsPage onNav={setScreen} openChat={openChat}/>}
    {screen === 'portfolio' && <PortfolioPage onNav={setScreen} openChat={openChat}/>}
    {screen === 'learn' && <LearnPage onNav={setScreen} openChat={openChat}/>}
    {screen === 'prompt-lab' && <PromptLabPage onNav={setScreen}/>}
    {screen === 'analytics' && <AnalyticsPage onNav={setScreen}/>}
    {screen === 'logs'      && <LogsPage onNav={setScreen}/>}
    {screen === 'rl-monitor' && <RLMonitorPage onNav={setScreen}/>}

    {/* Floating orb on non-auth screens */}
    {screen !== 'auth' && !chat && <SphereOrb onOpen={openChat} mode={tweaks.sphereMode}/>}
    <ChatOverlay open={chat} onClose={closeChat} mode={tweaks.sphereMode}/>

    {/* Secondary nav — Prompt Lab / Analytics / Logs / Sign out */}
    {/* Desktop: fixed pill bottom-left. Mobile: hidden here, accessible via hamburger menu. */}
    {screen !== 'auth' && (
      <div className="proto-nav" style={{
        position:'fixed', left:24, bottom:24, zIndex:55,
        display:'flex', gap:6, padding:6, background:'var(--bg-surface)',
        border:'1px solid var(--border)', borderRadius:999, boxShadow:'var(--shadow-md)'
      }}>
        <NavChip active={screen==='prompt-lab'} onClick={()=>setScreen('prompt-lab')} icon={<Icon.Settings size={14}/>} label="Prompt Lab"/>
        <NavChip active={screen==='analytics'} onClick={()=>setScreen('analytics')} icon={<Icon.Trend size={14}/>} label="Analytics"/>
        <NavChip active={screen==='logs'} onClick={()=>setScreen('logs')} icon={<Icon.Layers size={14}/>} label="Logs"/>
        <NavChip active={screen==='rl-monitor'} onClick={()=>setScreen('rl-monitor')} icon={<Icon.Activity size={14}/>} label="RL Monitor"/>
        <NavChip onClick={()=>setScreen('auth')} icon={<Icon.User size={14}/>} label="Sign out"/>
      </div>
    )}

    <TweaksPanel title="Tweaks">
      <TweakSection title="Theme">
        <TweakRadio value={tweaks.theme} options={[
          {value:'light', label:'Light'},
          {value:'dark',  label:'Dark'},
        ]} onChange={v=>setTweak('theme', v)}/>
      </TweakSection>
      <TweakSection title="Sphere style">
        <TweakRadio value={tweaks.sphereMode} options={[
          {value:'wireframe', label:'Wireframe'},
          {value:'liquid',    label:'Liquid'},
        ]} onChange={v=>setTweak('sphereMode', v)}/>
      </TweakSection>
      <TweakSection title="Density">
        <TweakRadio value={tweaks.density} options={[
          {value:'comfy', label:'Comfy'},
          {value:'cozy',  label:'Cozy'},
          {value:'dense', label:'Dense'},
        ]} onChange={v=>setTweak('density', v)}/>
      </TweakSection>
      <TweakSection title="Quick jump">
        <TweakButton onClick={()=>setScreen('auth')}>Open auth screen</TweakButton>
        <TweakButton onClick={goHome}>Open home</TweakButton>
        <TweakButton onClick={goAgents}>Open agents</TweakButton>
        <TweakButton onClick={()=>setScreen('portfolio')}>Open portfolio</TweakButton>
        <TweakButton onClick={()=>setScreen('learn')}>Open learn</TweakButton>
        <TweakButton onClick={()=>setScreen('prompt-lab')}>Open prompt lab</TweakButton>
        <TweakButton onClick={()=>setScreen('analytics')}>Open analytics</TweakButton>
        <TweakButton onClick={()=>setScreen('logs')}>Open logs</TweakButton>
        <TweakButton onClick={()=>setScreen('rl-monitor')}>Open RL Monitor</TweakButton>
      </TweakSection>
    </TweaksPanel>
  </>;
}

function NavChip({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} style={{
      display:'flex', alignItems:'center', gap:6, padding:'7px 12px', borderRadius:999,
      border:'none', background: active ? 'var(--bg-tinted)' : 'transparent',
      color: active ? 'var(--ink-1)' : 'var(--ink-2)',
      fontSize:12, fontWeight:600
    }}>{icon} {label}</button>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
