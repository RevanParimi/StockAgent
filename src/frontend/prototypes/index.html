<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (e) {
        console.warn('SW registration failed', e);
      });
    });
  }

  /* Compass Phase C — web-push (M4). Exposed as window.saPush so the in-app
   * Notifications setting (hamburger menu) can read status and toggle the
   * subscription. No floating button — the menu owns the UI now. */
  function saUrlB64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  window.saPush = {
    supported() {
      return ('serviceWorker' in navigator) && ('PushManager' in window)
        && ('Notification' in window);
    },
    // Returns 'on' | 'off' | 'denied' | 'unsupported'.
    async status() {
      if (!this.supported()) return 'unsupported';
      if (Notification.permission === 'denied') return 'denied';
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        return sub ? 'on' : 'off';
      } catch (e) { return 'off'; }
    },
    // Subscribe. Returns 'on' | 'denied' | 'unconfigured' | 'unsupported'.
    async enable() {
      if (!this.supported()) return 'unsupported';
      const reg = await navigator.serviceWorker.ready;
      const resp = await fetch('/delivery/push/public-key');
      const { public_key } = await resp.json();
      if (!public_key) return 'unconfigured';
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return 'denied';
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: saUrlB64ToUint8Array(public_key),
      });
      await fetch('/delivery/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub.toJSON()),
      });
      return 'on';
    },
    // Unsubscribe locally + on the server. Returns 'off'.
    async disable() {
      if (!this.supported()) return 'off';
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          const endpoint = sub.endpoint;
          await sub.unsubscribe();
          await fetch('/delivery/push/subscribe?endpoint=' + encodeURIComponent(endpoint),
            { method: 'DELETE' });
        }
      } catch (e) { console.warn('push disable failed', e); }
      return 'off';
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<!-- Chat bubble Markdown (SA-001): parser + HTML sanitizer, exact versions with
     SRI because both sit on the chat XSS boundary. chat-markdown.js combines

<script>
  // Take the raw parser off window at once, even if chat-markdown.js later
  // fails to load: a sphere.jsx cached before SA-001 calls window.marked directly.
  window.saMarkedLib = window.marked;
  delete window.marked;
</script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
<script src="chat-markdown.js"></script>
<script>
  /* Wave B (AUD-099/102): attach X-Scheduler-Key to same-origin API calls.
     The key is optional — when the server has no SCHEDULER_KEY set, requests
     work without it. Set it once via the prompt that appears on a 403, or
     manually: saSetKey('your-key'). */
  (function () {
    const realFetch = window.fetch.bind(window);
    window.saSetKey = function (k) {
      if (k) localStorage.setItem('sa_key', k);
      else localStorage.removeItem('sa_key');
    };
    /* M0 (spec 2026-07-26): bearer-session token helpers. Remember-me stores in
       localStorage (survives tab close); otherwise sessionStorage. */
    window.saGetToken = function () {
      return localStorage.getItem('sa_auth_token')
          || sessionStorage.getItem('sa_auth_token') || '';
    };
    window.saSetToken = function (tok, remember) {
      (remember ? localStorage : sessionStorage).setItem('sa_auth_token', tok);
      (remember ? sessionStorage : localStorage).removeItem('sa_auth_token');
      /* The verdict changes depend on the viewer (FIX-010): fetch them again
         as this account. data.jsx defines it; absent in demo mode. */
      if (typeof window.saLoadLearnings === 'function') window.saLoadLearnings();
    };
    window.saClearToken = function () {
      localStorage.removeItem('sa_auth_token');
      sessionStorage.removeItem('sa_auth_token');
      /* The verdict changes name the signed-out viewer's own stocks (FIX-010):
         drop them, so the next account never sees them. */
      if (typeof window.saForgetLearnings === 'function') window.saForgetLearnings();
    };
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : ((input && input.url) || '');
      const sameOrigin = url.startsWith('/') || url.startsWith(window.location.origin);
      if (sameOrigin) {
        const key = localStorage.getItem('sa_key');
        const tok = window.saGetToken();
        if (key || tok) {
          init = init || {};
          const h = Object.assign({}, init.headers || {});
          if (key) h['X-Scheduler-Key'] = key;
          if (tok) h['Authorization'] = 'Bearer ' + tok;
          init.headers = h;
        }
      }
      const resp = await realFetch(input, init);
      /* M0: a 401 on a request we DID send a token with means the session
         expired/was revoked — drop it and let the app show the login screen.
         (Login/signup carry no token, so their 401s never trigger this.) */
      if (resp.status === 401 && sameOrigin && window.saGetToken()) {
        window.saClearToken();
        try { window.dispatchEvent(new Event('sa-auth-expired')); } catch (e) {}
      }
      /* An owner-only read passes { saNoKeyPrompt: true } and shows its own
         message: its 403 means a member's session, and a member has no key
         to type. */
      if (resp.status === 403 && sameOrigin && !window.__saKeyPrompting
          && !(init && init.saNoKeyPrompt)) {
        window.__saKeyPrompting = true;
        try {
          const entered = window.prompt('This action needs the API key. Enter it to unlock:');
          if (entered && entered.trim()) {
            window.saSetKey(entered.trim());
            return window.fetch(input, init);
          }
        } finally {
          window.__saKeyPrompting = false;
        }
      }
      return resp;
    };
  })();
</script>
<script>
  /* Theme persistence + the single write path for `data-theme`.
     Lives here, before </head>, so a returning user's dark theme is on the
     documentElement before the first paint instead of flashing light while
     Babel transpiles and React mounts.

     saSetTheme is the ONLY place that touches data-theme. Both controls (the
     header ThemeToggle and the Settings Appearance segment) route through it,
     and it announces 'sa-theme' so whichever control did not originate the
     change can follow. Storage is localStorage-only by design — no table, no
     endpoint. */
  (function () {
    window.saGetTheme = function () {
      try { return localStorage.getItem('sa_theme'); } catch (e) { return null; }
    };
    window.saSetTheme = function (t) {
      const theme = t === 'dark' ? 'dark' : 'light';
      try { localStorage.setItem('sa_theme', theme); } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      try {
        window.dispatchEvent(new CustomEvent('sa-theme', { detail: theme }));
      } catch (e) {}
    };
    /* Null when the user has never chosen — App() then falls back to
       TWEAK_DEFAULTS.theme so the dev host's EDITMODE value still wins on a
       fresh profile. */
    const stored = window.saGetTheme();
    if (stored) document.documentElement.setAttribute('data-theme', stored);
  })();
</script>
<script>
  /* PR-001: the signed-in account ({user_id, display_name, role, …} from
     /auth/me), or null while unknown or signed out. App() publishes it with
     saSetUser (boot, sign-in, sign-out); screens read it with useSaUser().
     Operator tools render only when saIsOwner(user), so an unknown account
     sees none; the server's guards stay. These live here, not in a .jsx
     file: navigations are network-first but scripts are served from the
     service worker's cache first, so the first open after a deploy runs this
     file with the previous version's .jsx files, which must still render. */
  window.saUser = null;
  window.saSetUser = function (user) {
    window.saUser = user || null;
    try { window.dispatchEvent(new Event('sa-user')); } catch (e) {}
  };
  window.useSaUser = function () {
    const [user, setUser] = React.useState(function () { return window.saUser; });
    React.useEffect(function () {
      const on = function () { setUser(window.saUser); };
      window.addEventListener('sa-user', on);
      on();
      return function () { window.removeEventListener('sa-user', on); };
    }, []);
    return user;
  };
  window.saIsOwner = function (user) { return !!user && user.role === 'owner'; };

  /* PR-040: the operator screens' code is the owner's only. A member's
     browser never requests these files; an owner's requests them once
     /auth/me (or sign-in) says role "owner", and App() re-renders on
     'sa-operator'. sw.js does not list them either. Babel's own loader runs
     them in order; the last, inline script marks the set loaded (a file
     that failed is skipped, and its screen then says it could not load). */
  window.SA_OPERATOR_FILES = ['agents-page.jsx', 'analytics.jsx', 'logs.jsx',
                              'rl-data.jsx', 'rl-monitor.jsx'];
  window.saOperatorState = 'none';            // none | loading | ready | failed
  window.saOperatorLoaded = function () {
    window.saOperatorState = 'ready';
    try { window.dispatchEvent(new Event('sa-operator')); } catch (e) {}
  };
  window.saLoadOperator = function () {
    if (window.saOperatorState === 'loading' || window.saOperatorState === 'ready') return;
    if (!(window.Babel && window.Babel.transformScriptTags)) {
      window.saOperatorState = 'failed';
      try { window.dispatchEvent(new Event('sa-operator')); } catch (e) {}
      return;
    }
    window.saOperatorState = 'loading';
    const box = document.createElement('div');          // never attached: nothing else runs these
    window.SA_OPERATOR_FILES.forEach(function (f) {
      const el = document.createElement('script');
      el.type = 'text/babel';
      el.src = f;
      box.appendChild(el);
    });
    const done = document.createElement('script');
    done.type = 'text/babel';
    done.text = 'window.saOperatorLoaded();';
    box.appendChild(done);
    window.Babel.transformScriptTags(box.getElementsByTagName('script'));
  };
</script>
<script>
  /* PR-001: sample data is explicit. Only ?demo=1 installs the invented values
     in demo-fixtures.js, under a "Sample data" banner (the layout audit uses
     it). Otherwise every figure comes from the API or is shown as
     unavailable; a failed request never falls back to a sample. PR-040: the
     file itself is requested only then; data.jsx waits for it ('sa-demo-fixtures')
     if it has not run yet, and never asks the API in demo mode. */
  window.saDemoMode = new URLSearchParams(location.search).get('demo') === '1';
  if (window.saDemoMode) {
    const fixtures = document.createElement('script');
    fixtures.src = 'demo-fixtures.js';
    fixtures.async = false;
    fixtures.onload = function () {
      try { window.dispatchEvent(new Event('sa-demo-fixtures')); } catch (e) {}
    };
    document.head.appendChild(fixtures);
  }
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="hooks.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sphere.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>
<script type="text/babel" src="brief-view.jsx"></script>
<script type="text/babel" src="digest-view.jsx"></script>
<script type="text/babel" src="weekly-view.jsx"></script>
<script type="text/babel" src="inbox.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const SPHERE_MODE = 'wireframe';

// Notification deep links: '#/inbox' or '#/inbox/<brief|digest|weekly|alerts>'.
// One-shot: consumed (removed from the URL) so refresh doesn't re-trigger.
// The Inbox lives on Today now (PR-040); the links keep their old form.
function saConsumeDeepLink() {
  const m = /^#\/inbox(?:\/(brief|digest|weekly|alerts))?$/.exec(location.hash || '');
  if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  return { screen: 'inbox', tab: m[1] || 'brief' };
}

// Operator tools: owner accounts only (PR-001), loaded only for the owner
// (PR-040). A member never sees their menu or screens; the server routes keep
// their own guards.
const OPERATOR_SCREENS = { 'agents': 'AgentsPage', 'analytics': 'AnalyticsPage',
                           'logs': 'LogsPage', 'rl-monitor': 'RLMonitorPage' };

// Which screen to draw for `screen`. Anything else (Learn, or a screen an
// older cached script still offers) is Today. Scripts come from the service
// worker's cache first, so the first open after a deploy can run this file
// with the previous version's .jsx files: an old home.jsx has no Inbox
// inside it, and then the old Inbox screen still opens.
function saShownScreen(screen, isOwner) {
  if (screen === 'auth' || screen === 'home' || screen === 'portfolio' || screen === 'settings') return screen;
  if (screen === 'inbox') return !window.saTodayHoldsInbox && window.InboxPage ? 'inbox' : 'home';
  if (OPERATOR_SCREENS[screen]) return isOwner ? screen : 'home';
  return 'home';
}

// An operator screen, once its code has loaded.
function OperatorScreen({ name, onNav, openChat }) {
  const [, setTick] = useState(0);
  useEffect(() => {
    const on = () => setTick(n => n + 1);
    window.addEventListener('sa-operator', on);
    return () => window.removeEventListener('sa-operator', on);
  }, []);
  const Page = window[OPERATOR_SCREENS[name]];
  if (Page) return <Page onNav={onNav} openChat={openChat}/>;
  const state = window.saOperatorState;
  return (
    <div style={{ minHeight:'100vh', background:'var(--bg-base)' }}>
      {window.TopNav && <TopNav active={name} onNav={onNav}/>}
      <div className="card sa-unavailable" style={{ maxWidth:640, margin:'32px auto', padding:24,
        color:'var(--ink-3)', fontSize:13 }}>
        {state === 'loading' || state === 'none'
          ? 'Loading the operator tools…'
          : 'This operator screen could not load. Reload the page to try again.'}
      </div>
    </div>
  );
}

function App() {
  const user = useSaUser();
  const isOwner = saIsOwner(user);
  // The theme survives a reload through localStorage (saGetTheme/saSetTheme).
  const [theme, setTheme] = useState(() => (window.saGetTheme && window.saGetTheme()) || 'light');
  const [deepLink] = useState(saConsumeDeepLink);          // lazy: runs once
  // M0: a stored bearer token is the auth signal (validated at boot below).
  const hasToken = !!(window.saGetToken && window.saGetToken());
  const [screen, setScreen] = useState(
    hasToken ? (deepLink ? deepLink.screen : 'home') : 'auth');
  const [inboxTab, setInboxTab] = useState(deepLink ? deepLink.tab : 'brief');
  // Where to land after login when the tap arrived logged-out:
  const [pendingDest, setPendingDest] = useState(!hasToken && deepLink ? deepLink : null);
  const [chat, setChat] = useState(false);
  // PR-046: a question a card asks for the user ("Ask why"); n makes a repeat a new ask.
  const [ask, setAsk] = useState(null);
  const [, forceRender] = useState(0);

  // Settings' Appearance segment writes here. Go through saSetTheme so the
  // choice is persisted and the header toggle hears about it.
  useEffect(() => {
    window.saSetTheme(theme);
  }, [theme]);

  // ...and the reverse direction: the header ☾/☀ writes data-theme through
  // saSetTheme, which announces 'sa-theme'; mirror that back here so the
  // Settings segment can never show "Light" while the app is dark. The `!==`
  // guard is what stops the two effects ping-ponging.
  useEffect(() => {
    const onTheme = (e) => { if (e.detail !== theme) setTheme(e.detail); };
    window.addEventListener('sa-theme', onTheme);
    return () => window.removeEventListener('sa-theme', onTheme);
  }, [theme]);

  // Re-render with live API data once bootstrap fetch completes
  useEffect(() => {
    window.__onApiReady = () => forceRender(n => n + 1);
    if (window.__apiReady) forceRender(n => n + 1);
    return () => { window.__onApiReady = null; };
  }, []);

  // PR-040: the owner's operator code is requested once the role is known.
  useEffect(() => {
    if (isOwner && window.saLoadOperator) window.saLoadOperator();
  }, [isOwner]);

  // Warm notification tap: SW posts {type:'sa-open', url:'/#/inbox/<tab>'}.
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type !== 'sa-open') return;
      const m = /#\/inbox(?:\/(brief|digest|weekly|alerts))?$/.exec(d.url || '');
      const tab = (m && m[1]) || 'brief';
      setInboxTab(tab);
      if (window.saGetToken && window.saGetToken()) setScreen('inbox');
      else { setPendingDest({ screen: 'inbox', tab }); setScreen('auth'); }
    };
    navigator.serviceWorker.addEventListener('message', onMsg);
    return () => navigator.serviceWorker.removeEventListener('message', onMsg);
  }, []);

  // M0: validate a stored session at boot. An expired/revoked token makes
  // /auth/me 401 → the fetch wrapper clears it and fires 'sa-auth-expired'.
  // The answer is also who is signed in: the greeting's name and the role
  // that decides whether operator tools show.
  useEffect(() => {
    if (!(window.saGetToken && window.saGetToken())) return;
    fetch('/auth/me')
      .then(r => { if (!r.ok) { setScreen('auth'); return null; } return r.json(); })
      .then(d => { if (d && d.user) window.saSetUser(d.user); })
      .catch(() => {});
  }, []);

  // M0: session expiry mid-use → back to the login screen.
  useEffect(() => {
    const onExpired = () => { window.saSetUser(null); setScreen('auth'); };
    window.addEventListener('sa-auth-expired', onExpired);
    return () => window.removeEventListener('sa-auth-expired', onExpired);
  }, []);

  // openChat(question) opens the chat and sends that question; as an onClick
  // handler it receives the click event, which opens the chat with no question.
  const openChat = (question) => {
    setChat(true);
    if (typeof question === 'string' && question.trim()) setAsk({ text: question.trim(), n: Date.now() });
  };
  const closeChat = () => setChat(false);

  const nav = (s) => {
    if (s === 'ask') { openChat(); return; }   // Ask is the chat, over the current screen
    if (s === 'auth') {                       // sign out — revoke + drop token
      try { fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
      if (window.saClearToken) window.saClearToken();
      localStorage.removeItem('sa_remembered');
      window.saSetUser(null);
    }
    setScreen(s);
  };

  // Test seam for scripts/ui_responsive_audit.mjs — the prototype does no URL
  // routing, so the audit harness drives navigation through this.
  useEffect(() => { window.__auditNav = nav; return () => { window.__auditNav = null; }; });

  const onAuthed = (signedIn, remember) => {
    // auth.jsx has already stored the token via saSetToken; keep sa_remembered
    // as a legacy hint for any code still reading it.
    window.saSetUser(signedIn);
    if (remember) localStorage.setItem('sa_remembered', '1');
    else localStorage.removeItem('sa_remembered');
    if (pendingDest) {
      setInboxTab(pendingDest.tab);
      setScreen(pendingDest.screen);
      setPendingDest(null);
    } else {
      setScreen('home');
    }
  };
  // A member never lands on an operator screen, however `screen` was set.
  const shown = saShownScreen(screen, isOwner);

  return <>
    {window.saDemoMode && screen !== 'auth' && (
      <div className="sa-demo-banner" role="status" style={{
        padding:'6px 16px', background:'rgba(217,119,6,.92)', color:'#fff', fontSize:11,
        fontWeight:700, letterSpacing:'.04em', textAlign:'center'
      }}>Sample data — the market figures and portfolio here are not live</div>
    )}
    {shown === 'auth' && <AuthScreen onAuthed={onAuthed}/>}
    {shown === 'home' && <Home onNav={nav} openChat={openChat} inboxTab={inboxTab} setInboxTab={setInboxTab}/>}
    {shown === 'portfolio' && <PortfolioPage onNav={nav} openChat={openChat}/>}
    {shown === 'inbox' && <InboxPage onNav={nav} tab={inboxTab} setTab={setInboxTab}/>}
    {shown === 'settings' && <SettingsPage onNav={nav} theme={theme} setTheme={setTheme}/>}
    {OPERATOR_SCREENS[shown] && <OperatorScreen name={shown} onNav={nav} openChat={openChat}/>}

    {/* Floating orb on non-auth screens */}
    {screen !== 'auth' && !chat && <SphereOrb onOpen={openChat} mode={SPHERE_MODE}/>}
    <ChatOverlay open={chat} onClose={closeChat} mode={SPHERE_MODE} ask={ask}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
