id: M4
name: Learning loop
short: Learning
plane: middle
column: 3
summary: 30-day forecast each month, daily grading, lessons, regime
files:
  - core/intelligence/__init__.py
  - core/intelligence/rl/__init__.py
  - core/intelligence/rl/agents/__init__.py
  - core/intelligence/rl/algorithms/__init__.py
  - core/intelligence/rl/stores/__init__.py
  - core/intelligence/rl/workflows/__init__.py
  - core/intelligence/rl/provenance.py
  - core/intelligence/rl/stores/prediction_store.py
  - core/intelligence/rl/stores/store_inventory.py
  - core/intelligence/rl/stores/store_migration.py
  - core/schemas/feedback.py
  - src/backend/shared/schemas/feedback.py
submodules:
  - id: M4.1
    name: Monthly forecast
    summary: a 30-day "envelope" of predicted closes per stock
    files:
      - core/intelligence/rl/workflows/generate_forecast.py
      - core/intelligence/rl/algorithms/price_interpolator.py
      - core/intelligence/seasonal/__init__.py
      - core/intelligence/seasonal/calendar.py
      - core/intelligence/fno/*.py
      - core/intelligence/prompt_enhancer/*.py
    code: ["core/intelligence/rl/workflows/generate_forecast.py::generate_forecast",
           "core/intelligence/rl/workflows/generate_forecast.py::regenerate_envelope"]
    config: [rl.forecast_horizon_days]
    logic: |
      generate_forecast(stock, sector)     1st of month · startup self-heal · manual
        weights: observe ─► sector defaults | adapt ─► stored weights
        > run the analysis (M3), asking for the exact symbol
        > ?! not actionable + enforce ─► InsufficientDataError, NO envelope
        > ?! no base close, even after one retry in 15 s ─► fail; the next run retries
        > context
          learning ledger (past lessons)
          "blindspot" hints from past misses (saved for the month; the review reads them)
          seasonal calendar (sector events seeded per day)
          forecast profile: model-calibrated monthly return % + path shape
          | (front-loaded, back-loaded or linear; static values if the call fails)
          regime label, F&O snapshot, per-dimension catalyst predictions
        > 30 trading-day rows: predicted close, verdict, confidence, key assumptions,
        | gate status + source run id
        > save <TICKER>_<YYYY-MM>_prediction_envelope.json
        | (stamped with weight version, learning mode, gate and instrument)
  - id: M4.2
    name: Daily review
    summary: grade one stock on one session
    files:
      - core/intelligence/rl/workflows/daily_review.py
      - core/intelligence/rl/workflows/review_outcomes.py
      - core/intelligence/rl/workflows/month_end_validation.py
      - core/intelligence/rl/agents/feedback_agent.py
      - core/intelligence/rl/agents/thesis_reviewer.py
      - core/intelligence/rl/conviction/*.py
      - core/intelligence/rl/stores/offmarket_fetcher.py
      - core/intelligence/seasonal/validator.py
      - core/config/prompts/shared/feedback_agent.py
      - src/backend/shared/prompts/feedback_agent.py
    code: ["core/intelligence/rl/workflows/daily_review.py::run_daily_review",
           "core/intelligence/rl/agents/feedback_agent.py::FeedbackAgent",
           "core/intelligence/rl/agents/thesis_reviewer.py::ThesisReviewer"]
    config: [rl.agent_rerun_threshold_pct, rl.reforecast_enabled,
             rl.reforecast_thesis_mult_threshold]
    logic: |
      run_daily_review(stock, session D)
        Step 0   regime: VIX, FII proxy, sector RSI, global stress ─► raw label ─►
        | sticky label (M4.5)
        > Step 1   find D's forecast row (this month's envelope, else last month's)
          ?! no envelope ─► skipped (no_envelope)
          > ?! no row for D ─► skipped (no_forecast_row)
          > ? row issued on non-actionable data ─► gate (enforce: stop = data_gated)
          > ? identity or price basis changed ─► gate
        > Step 2   actual close for D (M2.1)
          ?! none ─► skipped (no_actual_data)
          > ? close not dated D ─► gate (a stale price would fake a flat day)
        > Step 3   error % = (actual − predicted) ÷ predicted; direction right?; timing
        > Step 4   why did we miss?
          ? direction right and |error| < 0.5%
            yes ─► reuse the forecast's scores (no re-run)
            no ─► re-run today's analysis (M3)
              ?! nothing scored ─► skipped (no_analysis)
              > ? re-run not actionable ─► gate
          > FeedbackAgent (model) ─► miss_type + analysis + new lessons
            miss types include data_gap, data_stale, external_shock, timing,
            | direction_flip, model_bias
        > Step 5   WeightAdapter (M4.3); + regime multipliers for today only, never saved
        > Step 6   lessons ─► the stock's ledger ─► sector and market ledgers by scope
        | (M4.4)
        > Step 6.5 conviction streak ─► "reversion prior" (the advisor's TRIM reads it)
        > ? Step 7a  big miss? ─► ThesisReviewer: which assumptions broke? confidence
        | multiplier
        > ? Re-forecast (live month only, not paper; the first match wins)
          external_shock + direction wrong
          thesis multiplier at or below the threshold (thesis_break)
          sticky regime has just turned MACRO_CRISIS (regime_flip)
          new envelope made ─► skip 7b
        > Step 7b  revise the remaining rows' confidence
        > Step 8   append a feedback entry to the month's log  ◄── this is "output"
        > Step 8.5 DossierCurator updates the company dossier (every day; never blocks)
        > off-market signals; was news available? (recorded per stock per day)
        > ? Step 9   last trading day of the month ─► seasonal validation
      Outcome: completed | degraded (written, on data the gate flagged) | data_gated
      | | skipped | failed
      paper=True (discovery's paper lane) ─► the same steps with every learning write
      | disabled
  - id: M4.3
    name: Weights and learning mode
    summary: how a miss would change the weights, and whether it does
    files:
      - core/intelligence/rl/agents/weight_adapter.py
      - core/intelligence/rl/learning_mode.py
      - core/intelligence/rl/algorithms/factor_regime.py
    code: ["core/intelligence/rl/agents/weight_adapter.py::WeightAdapter",
           "core/intelligence/rl/learning_mode.py::learning_mode"]
    config: [rl.learning_mode, rl.weight_boost_hit_rate, rl.weight_penalty_hit_rate,
             rl.bias_trigger, rl.weight_max_step, rl.weight_max_drift]
    logic: |
      WeightAdapter (one weight per dimension)
        what counts against a dimension
          the model was not at fault (data_gap, data_stale, external_shock) ─► no penalty
          a timing miss of 3 sessions or less ─► no bias penalty (it still counts as a
          | miss in the hit rate)
        > hit rate per dimension over the last N sessions
          ≥ 70% ─► +0.02
          ≤ 40% ─► −0.03
        > weighted rolling miss rate (5/10/21 sessions) ≥ 0.55 ─► bias penalty
        | (the factor regime, IIMA momentum, scales it)
        > clamp: largest step per day, largest drift from the base (wider after 14
        | correct sessions in a row)
        > renormalise so the weights sum to 1.0
      ? learning_mode: what happens to that result
        adapt ─► save a new weight version; lessons nudge dimension scores
        observe ─► the adapter runs on a copy; its proposal goes to
        | <TICKER>_weight_observations.json; decisions use the sector defaults;
        | lessons are recorded but move nothing
        an unknown value ─► fails closed to observe
  - id: M4.4
    name: Lessons and company knowledge
    summary: ledgers, dossier, event ingestion, research
    files:
      - core/intelligence/rl/stores/ledger_propagator.py
      - core/intelligence/rl/algorithms/lesson_emphasis.py
      - core/intelligence/rl/agents/dossier_curator.py
      - core/intelligence/rl/agents/event_ingestor.py
      - core/intelligence/rl/agents/question_researcher.py
      - core/config/prompts/shared/dossier_curator.py
      - core/config/prompts/shared/event_ingestor.py
      - core/config/prompts/shared/question_researcher.py
      - src/backend/shared/schemas/dossier.py
      - scripts/clean_ledger_errors.py
    code: ["core/intelligence/rl/agents/dossier_curator.py::DossierCurator",
           "core/intelligence/rl/agents/event_ingestor.py::EventIngestor",
           "core/intelligence/rl/agents/question_researcher.py::QuestionResearcher"]
    config: [rl.event_ingest_enabled, rl.research_loop_enabled]
    logic: |
      Lessons (written by the FeedbackAgent)
        ? the scope of a lesson
          stock_specific ─► the stock's learning ledger only
          sector_wide ─► + <sector>/_shared_ledger.json
          market_wide ─► + the sector ledger and _market_ledger.json
        read back as tiers: the stock's top 6, sector top 3, market top 2 (faded ones
        | left out)
        Monday 03:30 cleans old lessons and distils each dossier
      Dossier (what we know about the company); every write goes through ONE bounded
      | merge
        daily ......... DossierCurator (Step 8.5): the day's observations
        Sat 10:00 ..... EventIngestor: results, concalls, guidance from NSE filings
        | + one Tavily page each (a qualifying new filing is ingested the same day)
        Sat 11:00 ..... QuestionResearcher: picks open questions, runs targeted
        | searches, one model call judges; questions that stay unanswered expire
      Read by: the bundle's "dossier" section (M3), the chat's get_ticker_dossier, the
      | investment case at purchase (M5.5), the morning brief and the monthly scorecard
  - id: M4.5
    name: Regime and the living envelope
    summary: how rough is the market, and the pre-open shock check
    files:
      - core/intelligence/regime/*.py
      - core/intelligence/rl/workflows/preopen_check.py
      - core/config/prompts/shared/preopen_check.py
    code: ["core/intelligence/regime/detector.py::RegimeDetector",
           "core/intelligence/rl/workflows/preopen_check.py::run_preopen_check"]
    config: [regime.vix_volatile_threshold, regime.calm_days, regime.global_stress_min_signals,
             rl.preopen_check_enabled, rl.preopen_shock_severity]
    logic: |
      RegimeDetector (no model: VIX, 5-day FII proxy, sector RSI), first match wins
        ?! VIX > 22 and FII proxy < −1% ─► MACRO_CRISIS
        > ?! else VIX > 22, or VIX 14–22 with FII proxy < −1% ─► RISK_OFF
        > ?! else VIX < 14, FII > +1%, RSI > 70 ─► MOMENTUM_EXTENDED
        > ?! else VIX < 22, FII > +1%, RSI < 70 ─► RISK_ON
        > ?! else RSI < 30 ─► OVERSOLD
        > ! else NORMAL
      Global stress, applied to that label
        2 of 3 signals (Brent up 8% in 5 days, USD/INR up 1.5% in 5 days, S&P 500 down
        | 2%) ─► one notch more severe
      ? Sticky label (market-wide, _regime_state.json): a new reading
        severe ─► RISK_OFF or MACRO_CRISIS is entered at once
        milder while severe ─► calm_streak + 1; leave after 3 calm days
        inputs unavailable ─► keep the last label (or a severer one the answering inputs
        | prove), mark the day ─► no ADD, no new deployment
      Who reads the sticky label
        today's weight multipliers (M4.2 Step 5)
        advisor: crisis + falling path ─► EXIT; crisis or risk-off ─► no ADD
        deployment target: calm 80%, RISK_OFF 50%, MACRO_CRISIS 0% invested
        the brief's wording ("Steady", "Cautious", "Crisis")
      Pre-open check 08:45 (1 search + 1 fast model call in total)
        ?! overnight shock severity below the threshold ─► nothing
        > for each stock in the four sector configs' own lists (the managed list and the
        | holdings are not read)
          ?! no forecast for today, or it does not contradict the shock ─► left as it is
          > ! else regenerate_envelope(trigger="preopen_shock")
