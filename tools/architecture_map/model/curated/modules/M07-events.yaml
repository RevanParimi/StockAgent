id: M7
name: Company events
short: Events
plane: middle
column: 1
summary: filings and news per stock, typed and dated
submodules:
  - id: M7.1
    name: Company-event feed
    summary: 08:15 and 18:30 on trading days
    files:
      - core/events/*.py
      - core/config/prompts/shared/company_events.py
      - src/backend/shared/schemas/events.py
    code: ["core/events/feed.py::run_event_feed", "core/events/classify.py::ungrounded_figures"]
    config: [events.enabled, events.max_symbols, events.news_queries_per_day]
    logic: |
      run_event_feed()    08:15 and 18:30 on trading days; never raises
        which stocks: holdings ─► watchlists ─► shelf ideas (each once, up to a cap)
          identity unresolved ─► skipped and named
        > which items
          NSE announcements + board meetings (last N days)
          NSE disclosures: insider trades, SAST deals, pledges, shareholding
          company news searches (daily budget, half per run; an article that never names
          | the company is dropped)
        > new items only (by item identity; "not about this company" answers remembered)
        > typing
          disclosures ─► fixed rules, no model (insider, deal, pledge, ownership)
          announcements + news ─► one bulk model call per batch of a stock's items
            must cite an item it was given ─► else dropped (ungrounded)
            every figure of two or more digits must appear in the item ─► else dropped
            unknown category, direction or materiality ─► dropped (invalid)
        > the date is when NSE published it, never the trade day (when we could have known)
        > stored in data/events/<SYMBOL>.jsonl (no user data in it)
        > a new qualifying announcement of a managed stock ─► the dossier ingests it in
        | this run (M4.4), if switched on
      Read by: the evidence exit rule (case_broken), the investment case and its pillar
      | review (M5.5), GET /events/{symbol}
