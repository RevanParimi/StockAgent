id: M9
name: Delivery
short: Delivery
plane: top
column: 4
summary: morning brief, weekly review, alerts ─► push and email
files:
  - core/delivery/__init__.py
submodules:
  - id: M9.1
    name: Morning brief
    summary: 08:50 on weekdays
    files: [core/delivery/brief.py]
    code: ["core/delivery/brief.py::build_morning_brief"]
    config: [delivery.enabled]
    logic: |
      Morning brief (08:50, weekdays)
        ?! not a trading day ─► skipped
        > assembled by code: the regime in plain words, the overnight markets and news,
        | holdings needing attention, results due, new shelf ideas, IPOs and lock-in
        | expiries
        > one bulk model call: the headline and a note on each overnight item (fallback
        | text on failure)
        > sent by push and email; lock-in expiries also go to that account's alerts
        research tone: the model is told never to call it advice; the page says it is not
        | advice
  - id: M9.2
    name: Weekly review
    summary: Sunday 18:00, with the index watch
    files: [core/delivery/weekly.py, core/delivery/index_watch.py]
    code: ["core/delivery/weekly.py::build_weekly_review", "core/delivery/index_watch.py::run_index_watch"]
    config: [delivery.enabled]
    logic: |
      Weekly review (Sunday 18:00)
        index watch first: constituent changes ─► alerts
          a shelf stock ─► everyone
          any other stock ─► only accounts holding or watching it
        > results scorecard ─► allocation vs risk profile ─► laggards ─► switch calls
        | (last 4 weeks) ─► shelf candidates ─► IPO watch
        > one bulk model headline call
  - id: M9.3
    name: Alerts
    summary: who gets what, once
    files: [core/delivery/alerts.py]
    code: ["core/delivery/alerts.py::emit_alerts"]
    logic: |
      ? who gets what
        operator notice ─► the owner only (system health, job crash, model down)
        market notice ─► everyone (shelf adds, pre-open re-forecasts, index changes for
        | shelf stocks)
        account notice ─► that account only (your advice, your trades, your stocks,
        | lock-in expiries)
      dedupe key user|date|kind|symbol in alerts_sent.jsonl
        ?! already delivered today ─► not sent again
        > send it
        > ? no channel accepted it ─► marked undelivered ─► retried at the next emit
  - id: M9.4
    name: Channels
    summary: web push and email
    files: [core/delivery/channels.py, scripts/gen_vapid_keys.py]
    code: ["core/delivery/channels.py::deliver", "core/delivery/channels.py::SendResult"]
    config: [delivery.push_enabled, delivery.email_enabled]
    logic: |
      deliver(title, body, user, kind)
        ?! delivery off ─► nothing is sent
        > ?! else Atlas on, and the outbox can be written ─► queued for its sender (M9.5)
        > else send now
          web push (VAPID) ─► a dead subscription (400/403/404/410) is pruned
          email ─► SMTP or Resend ("auto" uses Resend when a key is set)
        > each send returns SendResult: accepted? permanent? reason (addresses masked)
        "accepted" means the transport took it; nothing confirms a person read it.
  - id: M9.5
    name: Outbox
    summary: a durable queue with one sender
    files: [core/delivery/outbox.py]
    code: ["core/delivery/outbox.py::start_outbox_drainer"]
    config: [atlas.enabled, delivery.outbox_max_attempts]
    logic: |
      Drainer (runs only in the primary worker)
        claim a row: UPDATE ... SET status='sending' ─► one sender only
        > send it
        > ? the result
          accepted ─► delivered (+ which transport)
          permanent failure ─► dead letter at once
          transient failure ─► retry after backoff (≥ the provider's Retry-After)
          | ─► too many attempts ─► dead letter
      a row left in 'sending' by a restart ─► dead letter (outcome unknown; never resent)
      GET /delivery/outbox (owner): counts and dead letters, no message contents
