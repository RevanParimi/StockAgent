# One stock's life, end to end, and the guided tour: the viewer plays both.
#
# A trace step: `when`, `text`, the parts, stores, outside parties and jobs it names (`refs`, a
# job standing for its part), and, as from>to, the flows of flows.yaml that carry something in
# it (`flows`; both ends among the refs). The step lights what it names.
# A tour stop: `preset` (front, top, side, below, clock, or `focus` to fly to one module or
# part), `ref` (what it is about; on the clock, a job) and a one-line `caption`.
traces:
  - id: one-stocks-life
    title: One stock's life, end to end
    steps:
      - when: Saturday
        text: "discovery: XYZ ranks high ─► deep dive: BUY by band and model, conviction 0.68, actionable"
        refs: [M6.1, M6.3, M3, M2]
        flows: ["M2>M6", "M6>M3", "M2>M3"]
      - when: Saturday
        text: "shelf (entry band, invalidation level) ─► ‘tracking only’ alert to all"
        refs: [M6.3, M9.3, S.shelf, ext.user]
        flows: ["M9>ext.user"]
      - when: Saturday
        text: "paper envelope and weekly paper review start"
        refs: [M6.5, S.paper]
      - when: Mon 16:30
        text: "reviews Friday ─► XYZ not offered (its dive came after Friday’s close)"
        refs: [rl_daily_review, M6.4]
      - when: Tue 16:30
        text: "reviews Monday ─► XYZ is a buy candidate; regime NORMAL, book below 80% ─► size 3.2% of equity"
        refs: [M6.4, M5.4]
        flows: ["M6>M5"]
      - when: Tue 16:30
        text: "band, surveillance, identity, caps, cash floor all pass ─► BUY at Monday’s close; costs charged; case written; XYZ joins the managed list"
        refs: [M5.3, M5.5, M2, M3, S.portfolio, S.managed]
        flows: ["M2>M5", "M3>M5"]
      - when: Afterwards
        text: "its envelope is made by the next deploy’s self-heal, the 1st-of-month job or a manual trigger; until then ‘skipped: no_envelope’ and the advice reads a FLAT path: no ADD, price stops still protect it"
        refs: [M1.1, M4.1, M5.2]
      - when: Every day
        text: "16:30 grades its forecast row ─► advisor: HOLD / ADD / TRIM / EXIT / SWITCH"
        refs: [M4.2, M5.2, S.predictions, S.advice]
        flows: ["M4>M5"]
      - when: Every day
        text: "08:15 and 18:30 the events feed watches its filings and news"
        refs: [M7.1, M5.5, S.events]
        flows: ["M7>M5"]
      - when: Every night
        text: "23:45 the auditor grades matured advice against the Nifty"
        refs: [M11.1, M5, S.audit]
        flows: ["M5>M11"]
      - when: Exit day
        text: "for example a stop breach ─► EXIT ─► SELL at that session’s close ─► realised profit or loss ─► alert and digest ─► resale wait before it can be bought back"
        refs: [M5.2, M5.3, M9.3, M6.4, ext.user, S.portfolio]
        flows: ["M5>M9", "M9>ext.user"]
      - when: Sunday
        text: "weekly results: the closed trade, its exit reason, the book against the Nifty"
        refs: [M5.7, M9.2, ext.user, S.history]
        flows: ["M5>M9", "M9>ext.user"]
tours:
  - id: guided-tour
    title: The guided tour
    steps:
      - preset: front
        caption: "StockAgent researches NSE stocks and trades them with paper money: data flows left to right, to a verdict, a trade and a message to you."
      - preset: focus
        ref: M6
        caption: "Every Saturday, discovery screens the market and analyses the best few; the ideas that pass wait on a shelf with an entry price band."
      - preset: focus
        ref: M3
        caption: "Research turns one stock into one verdict from a checked bundle of data; a gate can refuse to give one when too much is missing."
      - preset: focus
        ref: M5
        caption: "Portfolio applies written rules to hold, add, trim, sell or switch, and buys shelf ideas, in paper money at the reviewed day’s close."
      - preset: focus
        ref: M4
        caption: "Learning forecasts each managed stock for a month, grades it every weekday and reads the market’s mood; in production it changes no weights."
      - preset: top
        ref: M11
        caption: "Measurement grades matured calls against the Nifty every night; the grades change no decision, and broken rules are reported to the owner."
      - preset: below
        ref: S.portfolio
        caption: "From below: which module writes which file. The portfolio’s transaction ledger is the authority for every holding and trade."
      - preset: clock
        ref: rl_daily_review
        caption: "The clock drives it all: at 16:30 on weekdays the review grades the previous session, then the portfolio trades at that session’s close."
